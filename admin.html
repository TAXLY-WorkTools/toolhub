<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工具管理后台 · TAXLY WorkTools</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f6f8fa;
    color: #24292f;
    font-size: 14px;
    line-height: 1.6;
  }
  .topbar {
    background: #24292f;
    color: #fff;
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topbar__title { font-size: 16px; font-weight: 600; }
  .topbar__title span { color: #58a6ff; }
  .topbar__right { display: flex; align-items: center; gap: 12px; }
  .token-status {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 12px;
    background: rgba(255,255,255,0.1);
  }
  .token-status.ok { background: #238636; }
  .token-status.no { background: #6e7681; }
  .btn {
    padding: 6px 14px;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    background: #f6f8fa;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.15s;
  }
  .btn:hover { background: #eaeef2; }
  .btn--primary { background: #2da44e; color: #fff; border-color: #2da44e; }
  .btn--primary:hover { background: #22863a; }
  .btn--danger { background: #cf222e; color: #fff; border-color: #cf222e; }
  .btn--danger:hover { background: #a40e26; }
  .btn--sm { padding: 4px 10px; font-size: 12px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .main { display: flex; min-height: calc(100vh - 52px); }
  .sidebar {
    width: 200px;
    background: #fff;
    border-right: 1px solid #d0d7de;
    padding: 16px 0;
    flex-shrink: 0;
  }
  .menu-item {
    padding: 10px 20px;
    cursor: pointer;
    font-size: 14px;
    color: #24292f;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s;
    border-left: 3px solid transparent;
  }
  .menu-item:hover { background: #f6f8fa; }
  .menu-item.active {
    background: #ddf4ff;
    color: #0969da;
    border-left-color: #0969da;
    font-weight: 500;
  }
  .content { flex: 1; padding: 24px; min-width: 0; }
  .content__title {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid #d0d7de;
  }
  .card {
    background: #fff;
    border: 1px solid #d0d7de;
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 16px;
  }
  .card__title { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: #1f2328; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-weight: 500; font-size: 13px; margin-bottom: 4px; color: #424a53; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 8px 12px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 13px; font-family: inherit;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none; border-color: #0969da; box-shadow: 0 0 0 3px rgba(9,105,218,0.15);
  }
  .form-row { display: flex; gap: 12px; }
  .form-row .form-group { flex: 1; }
  .table {
    width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #d0d7de; border-radius: 8px; overflow: hidden;
  }
  .table th, .table td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #f0f1f3; font-size: 13px; }
  .table th { background: #f6f8fa; font-weight: 600; color: #424a53; }
  .table tr:last-child td { border-bottom: none; }
  .table tr:hover { background: #f6f8fa; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; margin-right: 4px; }
  .tag--dept { background: #ddf4ff; color: #0969da; }
  .tag--func { background: #dafbe1; color: #116329; }
  .tag--offline { background: #eaeef2; color: #57606a; }
  .search-box { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; }
  .search-box input { flex: 1; padding: 8px 12px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 13px; }
  .toast {
    position: fixed; top: 70px; right: 24px; padding: 12px 20px; border-radius: 8px; color: #fff; font-size: 14px;
    z-index: 1000; opacity: 0; transform: translateY(-10px); transition: opacity 0.2s, transform 0.2s; max-width: 400px;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.success { background: #1a7f37; }
  .toast.error { background: #cf222e; }
  .toast.info { background: #0969da; }
  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5);
    z-index: 200; justify-content: center; align-items: center;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 12px; padding: 24px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; }
  .modal__title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
  .modal__actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .loading { text-align: center; padding: 40px; color: #8b949e; }
  .loading::after {
    content: ''; display: inline-block; width: 20px; height: 20px; border: 2px solid #d0d7de;
    border-top-color: #0969da; border-radius: 50%; animation: spin 0.8s linear infinite; margin-left: 10px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; padding: 40px; color: #8b949e; font-style: italic; }
  .file-tree { font-family: monospace; font-size: 13px; }
  .file-tree-item { padding: 6px 10px; display: flex; justify-content: space-between; align-items: center; border-radius: 4px; }
  .file-tree-item:hover { background: #f6f8fa; }
  .file-tree-item .name { display: flex; align-items: center; gap: 6px; }
  .file-tree-item .actions { display: flex; gap: 6px; opacity: 0; transition: opacity 0.15s; }
  .file-tree-item:hover .actions { opacity: 1; }
  @media (max-width: 768px) {
    .main { flex-direction: column; }
    .sidebar { width: 100%; display: flex; overflow-x: auto; padding: 8px; }
    .menu-item { white-space: nowrap; border-left: none; border-bottom: 3px solid transparent; }
    .menu-item.active { border-bottom-color: #0969da; border-left: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar__title">🔧 <span>TAXLY WorkTools</span> · 工具管理后台</div>
  <div class="topbar__right">
    <span class="token-status no" id="tokenStatus">未认证</span>
    <button class="btn btn--sm" onclick="showTokenModal()">设置 Token</button>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <div class="menu-item active" data-module="labels" onclick="switchModule('labels')">📑 标签管理</div>
    <div class="menu-item" data-module="tools" onclick="switchModule('tools')">📦 工具列表</div>
    <div class="menu-item" data-module="edit" onclick="switchModule('edit')">✏️ 工具编辑</div>
    <div class="menu-item" data-module="files" onclick="switchModule('files')">📁 文件管理</div>
    <div class="menu-item" data-module="delete" onclick="switchModule('delete')">🗑️ 工具删除</div>
    <div class="menu-item" data-module="issues" onclick="switchModule('issues')">📋 上传记录</div>
  </div>
  <div class="content" id="content">
    <div class="loading">请先设置 GitHub Token</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="tokenModal">
  <div class="modal">
    <div class="modal__title">🔑 设置 GitHub Token</div>
    <p style="margin-bottom:12px; font-size:13px; color:#57606a;">
      需要具有 <strong>repo</strong> 权限的 Personal Access Token (PAT)。<br>
      Token 仅保存在您的浏览器 localStorage 中，不会上传到任何服务器。
    </p>
    <div class="form-group">
      <label>Token</label>
      <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
    </div>
    <div class="modal__actions">
      <button class="btn" onclick="closeTokenModal()">取消</button>
      <button class="btn btn--primary" onclick="saveToken()">保存并验证</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="confirmModal">
  <div class="modal">
    <div class="modal__title" id="confirmTitle">确认操作</div>
    <div id="confirmBody" style="margin-bottom:12px;"></div>
    <div class="form-group" id="confirmInputGroup" style="display:none;">
      <label id="confirmInputLabel">请输入确认内容</label>
      <input type="text" id="confirmInput">
    </div>
    <div class="modal__actions">
      <button class="btn" onclick="closeConfirmModal()">取消</button>
      <button class="btn btn--danger" id="confirmBtn" onclick="executeConfirm()">确认</button>
    </div>
  </div>
</div>

<script>
const ORG = 'TAXLY-WorkTools';
const TOOLHUB_REPO = 'toolhub';
const UPLOAD_REPO = 'upload-portal';
let currentToken = localStorage.getItem('admin_token') || '';
let currentUser = null;
let currentModule = 'labels';
let confirmCallback = null;

function showToast(msg, type = 'info') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast ' + type + ' show';
  setTimeout(() => { toast.className = 'toast ' + type; }, 3000);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function formatDate(isoStr) {
  if (!isoStr) return '-';
  return new Date(isoStr).toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
}

async function ghApi(path, options = {}) {
  if (!currentToken) throw new Error('请先设置 GitHub Token');
  const url = path.startsWith('http') ? path : `https://api.github.com${path}`;
  const headers = {
    'Authorization': `token ${currentToken}`,
    'Accept': 'application/vnd.github.v3+json',
    ...options.headers
  };
  if (options.body && typeof options.body === 'object') {
    headers['Content-Type'] = 'application/json';
    options.body = JSON.stringify(options.body);
  }
  const resp = await fetch(url, { ...options, headers });
  if (!resp.ok) {
    let errMsg = `HTTP ${resp.status}`;
    try { const errData = await resp.json(); errMsg = errData.message || errMsg; } catch(e) {}
    throw new Error(errMsg);
  }
  if (resp.status === 204) return null;
  return resp.json();
}

async function ghGet(path) { return ghApi(path); }
async function ghPut(path, body) { return ghApi(path, { method: 'PUT', body }); }
async function ghPost(path, body) { return ghApi(path, { method: 'POST', body }); }
async function ghDelete(path) { return ghApi(path, { method: 'DELETE' }); }
async function ghPatch(path, body) { return ghApi(path, { method: 'PATCH', body }); }

async function getFileContent(repo, path) {
  try {
    const data = await ghGet(`/repos/${ORG}/${repo}/contents/${path}`);
    if (Array.isArray(data)) return null;
    return { content: atob(data.content.replace(/\n/g, '')), sha: data.sha, name: data.name, path: data.path };
  } catch(e) {
    if (e.message.includes('404')) return null;
    throw e;
  }
}

async function updateFileContent(repo, path, content, message, sha = null) {
  const body = { message: message, content: btoa(unescape(encodeURIComponent(content))), branch: 'main' };
  if (sha) body.sha = sha;
  return ghPut(`/repos/${ORG}/${repo}/contents/${path}`, body);
}

function showTokenModal() {
  document.getElementById('tokenInput').value = currentToken;
  document.getElementById('tokenModal').classList.add('show');
}

function closeTokenModal() { document.getElementById('tokenModal').classList.remove('show'); }

async function saveToken() {
  const token = document.getElementById('tokenInput').value.trim();
  if (!token) { showToast('请输入 Token', 'error'); return; }
  currentToken = token;
  try {
    const user = await ghGet('/user');
    currentUser = user;
    localStorage.setItem('admin_token', token);
    updateTokenStatus();
    closeTokenModal();
    showToast(`认证成功：${user.login}`, 'success');
    switchModule(currentModule);
  } catch(e) {
    showToast('Token 验证失败：' + e.message, 'error');
    currentToken = '';
  }
}

function updateTokenStatus() {
  const el = document.getElementById('tokenStatus');
  if (currentToken && currentUser) {
    el.textContent = `✅ ${currentUser.login}`;
    el.className = 'token-status ok';
  } else {
    el.textContent = '未认证';
    el.className = 'token-status no';
  }
}

async function initToken() {
  if (currentToken) {
    try {
      const user = await ghGet('/user');
      currentUser = user;
      updateTokenStatus();
      switchModule(currentModule);
      return;
    } catch(e) {
      currentToken = '';
      localStorage.removeItem('admin_token');
    }
  }
  document.getElementById('content').innerHTML = '<div class="empty">请先点击右上角"设置 Token"进行认证</div>';
}

function showConfirm(title, body, callback, options = {}) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmBody').innerHTML = body;
  confirmCallback = callback;
  const inputGroup = document.getElementById('confirmInputGroup');
  if (options.confirmText) {
    inputGroup.style.display = 'block';
    document.getElementById('confirmInputLabel').textContent = `请输入 "${options.confirmText}" 确认`;
    document.getElementById('confirmInput').value = '';
    document.getElementById('confirmInput').dataset.expected = options.confirmText;
  } else {
    inputGroup.style.display = 'none';
  }
  const confirmBtn = document.getElementById('confirmBtn');
  confirmBtn.className = 'btn ' + (options.danger ? 'btn--danger' : 'btn--primary');
  confirmBtn.textContent = options.confirmBtnText || '确认';
  document.getElementById('confirmModal').classList.add('show');
}

function closeConfirmModal() {
  document.getElementById('confirmModal').classList.remove('show');
  confirmCallback = null;
}

function executeConfirm() {
  const inputGroup = document.getElementById('confirmInputGroup');
  if (inputGroup.style.display !== 'none') {
    const input = document.getElementById('confirmInput');
    const expected = input.dataset.expected;
    if (input.value.trim() !== expected) { showToast('确认内容不匹配', 'error'); return; }
  }
  closeConfirmModal();
  if (confirmCallback) confirmCallback();
}

function switchModule(module) {
  currentModule = module;
  document.querySelectorAll('.menu-item').forEach(el => {
    el.classList.toggle('active', el.dataset.module === module);
  });
  if (!currentToken) {
    document.getElementById('content').innerHTML = '<div class="empty">请先设置 GitHub Token</div>';
    return;
  }
  const renderers = {
    labels: renderLabels, tools: renderTools, edit: renderEditSelect,
    files: renderFilesSelect, delete: renderDelete, issues: renderIssues
  };
  if (renderers[module]) renderers[module]();
}

async function renderLabels() {
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="content__title">📑 标签管理</div>
    <div class="card">
      <div class="card__title">添加标签</div>
      <div class="form-row">
        <div class="form-group">
          <label>类型</label>
          <select id="labelType">
            <option value="dept">部门标签 (dept-xxx)</option>
            <option value="func">功能标签 (func-xxx)</option>
          </select>
        </div>
        <div class="form-group">
          <label>中文名称</label>
          <input type="text" id="labelName" placeholder="如：审计部 / 数据分析">
        </div>
        <div class="form-group" style="display:flex; align-items:flex-end;">
          <button class="btn btn--primary" onclick="addLabel()">添加</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card__title">当前标签列表</div>
      <div id="labelsList" class="loading">加载中...</div>
    </div>
  `;
  await loadLabels();
}

async function loadLabels() {
  try {
    const file = await getFileContent(TOOLHUB_REPO, 'labels.json');
    const labels = file ? JSON.parse(file.content) : { departments: [], functions: [] };
    const list = document.getElementById('labelsList');
    let html = '<table class="table"><thead><tr><th>类型</th><th>标签名</th><th>中文名</th><th>操作</th></tr></thead><tbody>';
    (labels.departments || []).forEach(l => {
      html += `<tr><td><span class="tag tag--dept">部门</span></td><td><code>${escapeHtml(l.name)}</code></td><td>${escapeHtml(l.display_name || '')}</td><td><button class="btn btn--sm btn--danger" onclick="deleteLabel('dept','${escapeHtml(l.name)}')">删除</button></td></tr>`;
    });
    (labels.functions || []).forEach(l => {
      html += `<tr><td><span class="tag tag--func">功能</span></td><td><code>${escapeHtml(l.name)}</code></td><td>${escapeHtml(l.display_name || '')}</td><td><button class="btn btn--sm btn--danger" onclick="deleteLabel('func','${escapeHtml(l.name)}')">删除</button></td></tr>`;
    });
    html += '</tbody></table>';
    list.innerHTML = html;
  } catch(e) {
    document.getElementById('labelsList').innerHTML = `<div class="empty">加载失败：${escapeHtml(e.message)}</div>`;
  }
}

async function addLabel() {
  const type = document.getElementById('labelType').value;
  const name = document.getElementById('labelName').value.trim();
  if (!name) { showToast('请输入标签名称', 'error'); return; }
  const prefix = type === 'dept' ? 'dept-' : 'func-';
  const labelName = prefix + name.toLowerCase().replace(/\s+/g, '-');
  try {
    const file = await getFileContent(TOOLHUB_REPO, 'labels.json');
    const labels = file ? JSON.parse(file.content) : { departments: [], functions: [] };
    const arr = type === 'dept' ? labels.departments : labels.functions;
    if (arr.some(l => l.name === labelName)) { showToast('标签已存在', 'error'); return; }
    arr.push({ name: labelName, display_name: name });
    await updateFileContent(TOOLHUB_REPO, 'labels.json', JSON.stringify(labels, null, 2), `feat(labels): 添加标签 ${labelName}`, file?.sha);
    showToast(`标签 ${labelName} 添加成功`, 'success');
    document.getElementById('labelName').value = '';
    await loadLabels();
  } catch(e) {
    showToast('添加失败：' + e.message, 'error');
  }
}

async function deleteLabel(type, name) {
  showConfirm('删除标签', `确定要删除标签 <code>${escapeHtml(name)}</code> 吗？`, async () => {
    try {
      const file = await getFileContent(TOOLHUB_REPO, 'labels.json');
      const labels = JSON.parse(file.content);
      const arr = type === 'dept' ? labels.departments : labels.functions;
      const idx = arr.findIndex(l => l.name === name);
      if (idx >= 0) arr.splice(idx, 1);
      await updateFileContent(TOOLHUB_REPO, 'labels.json', JSON.stringify(labels, null, 2), `feat(labels): 删除标签 ${name}`, file.sha);
      showToast('标签已删除', 'success');
      await loadLabels();
    } catch(e) {
      showToast('删除失败：' + e.message, 'error');
    }
  }, { danger: true });
}

async function renderTools() {
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="content__title">📦 工具列表</div>
    <div class="search-box">
      <input type="text" id="toolSearch" placeholder="搜索工具名称或描述..." oninput="filterTools()">
      <select id="toolFilterDept" onchange="filterTools()"><option value="">全部部门</option></select>
      <select id="toolFilterFunc" onchange="filterTools()"><option value="">全部功能</option></select>
    </div>
    <div id="toolsList" class="loading">加载中...</div>
  `;
  await loadTools();
}

let allTools = [];

async function loadTools() {
  try {
    const repos = await ghGet(`/orgs/${ORG}/repos?per_page=100&sort=updated`);
    allTools = repos.filter(r => !['toolhub', 'upload-portal', 'tool-template'].includes(r.name));
    const labelsFile = await getFileContent(TOOLHUB_REPO, 'labels.json');
    const labels = labelsFile ? JSON.parse(labelsFile.content) : { departments: [], functions: [] };
    const deptSelect = document.getElementById('toolFilterDept');
    const funcSelect = document.getElementById('toolFilterFunc');
    labels.departments.forEach(l => { deptSelect.innerHTML += `<option value="${escapeHtml(l.name)}">${escapeHtml(l.display_name)}</option>`; });
    labels.functions.forEach(l => { funcSelect.innerHTML += `<option value="${escapeHtml(l.name)}">${escapeHtml(l.display_name)}</option>`; });
    renderToolsList(allTools);
  } catch(e) {
    document.getElementById('toolsList').innerHTML = `<div class="empty">加载失败：${escapeHtml(e.message)}</div>`;
  }
}

function renderToolsList(tools) {
  const list = document.getElementById('toolsList');
  if (tools.length === 0) { list.innerHTML = '<div class="empty">没有找到工具</div>'; return; }
  let html = '<table class="table"><thead><tr><th>工具名称</th><th>描述</th><th>标签</th><th>大小</th><th>更新时间</th><th>操作</th></tr></thead><tbody>';
  tools.forEach(r => {
    const topics = r.topics || [];
    const tags = topics.map(t => {
      const cls = t.startsWith('dept-') ? 'tag--dept' : 'tag--func';
      return `<span class="tag ${cls}">${escapeHtml(t)}</span>`;
    }).join('');
    html += `<tr><td><strong>${escapeHtml(r.name)}</strong></td><td>${escapeHtml(r.description || '-')}</td><td>${tags || '-'}</td><td>${r.size} KB</td><td>${formatDate(r.updated_at)}</td><td><button class="btn btn--sm" onclick="viewToolReadme('${escapeHtml(r.name)}')">查看</button> <a class="btn btn--sm" href="${r.html_url}" target="_blank">GitHub</a></td></tr>`;
  });
  html += '</tbody></table>';
  list.innerHTML = html;
}

function filterTools() {
  const keyword = document.getElementById('toolSearch').value.toLowerCase();
  const dept = document.getElementById('toolFilterDept').value;
  const func = document.getElementById('toolFilterFunc').value;
  let filtered = allTools;
  if (keyword) filtered = filtered.filter(r => r.name.toLowerCase().includes(keyword) || (r.description || '').toLowerCase().includes(keyword));
  if (dept) filtered = filtered.filter(r => (r.topics || []).includes(dept));
  if (func) filtered = filtered.filter(r => (r.topics || []).includes(func));
  renderToolsList(filtered);
}

async function viewToolReadme(repo) {
  try {
    const file = await getFileContent(repo, 'README.md');

function parseReadme(md) {
  const result = { title: '', description: '', features: [], env: [], steps: '', faq: '' };
  const lines = md.split('\n');
  let section = '';
  let stepContent = [];
  let faqContent = [];
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.startsWith('# ')) { result.title = line.substring(2).trim(); continue; }
    if (line.startsWith('## ')) {
      const heading = line.substring(3).trim();
      if (heading.includes('功能')) section = 'features';
      else if (heading.includes('环境')) section = 'env';
      else if (heading.includes('步骤')) section = 'steps';
      else if (heading.includes('问题') || heading.includes('FAQ')) section = 'faq';
      else section = '';
      continue;
    }
    if (section === 'features' && line.startsWith('- ')) result.features.push(line.substring(2).trim());
    else if (section === 'env' && line.startsWith('- ')) result.env.push(line.substring(2).trim());
    else if (section === 'steps') stepContent.push(line);
    else if (section === 'faq') faqContent.push(line);
    else if (!section && line.trim() && !result.description) result.description = line.trim();
  }
  result.steps = stepContent.join('\n').trim();
  result.faq = faqContent.join('\n').trim();
  return result;
}

function buildReadmeFromForm() {
  const title = document.getElementById('editTitle').value.trim() || editingTool;
  const desc = document.getElementById('editDesc').value.trim();
  const features = document.getElementById('editFeatures').value.split('\n').map(s => s.trim()).filter(Boolean);
  const env = document.getElementById('editEnv').value.split('\n').map(s => s.trim()).filter(Boolean);
  const steps = document.getElementById('editSteps').value.trim();
  const faq = document.getElementById('editFaq').value.trim();
  let md = `# ${title}\n\n`;
  if (desc) md += `${desc}\n\n`;
  if (features.length) { md += `## 主要功能\n\n`; features.forEach(f => md += `- ${f}\n`); md += '\n'; }
  if (env.length) { md += `## 环境要求\n\n`; env.forEach(e => md += `- ${e}\n`); md += '\n'; }
  if (steps) md += `## 使用步骤\n\n${steps}\n\n`;
  if (faq) md += `## 常见问题\n\n${faq}\n\n`;
  return md;
}

    `;

      items.forEach(item => {
        const icon = item.type === 'dir' ? '📁' : '📄';
        tree.innerHTML += `
          <div class="file-tree-item">
            <div class="name">${icon} ${escapeHtml(item.name)} <span style="color:#8b949e;font-size:11px;">(${(item.size / 1024).toFixed(1)} KB)</span></div>

            </div>

      const imgDir = items.find(i => i.name === 'images');

      if (imgDir) await loadSubDir('images/', tree);

async function loadSubDir(path, container) {
  try {
    const items = await ghGet(`/repos/${ORG}/${fileTool}/contents/${path}`);
    if (Array.isArray(items)) {
      items.forEach(item => {
        const icon = item.type === 'dir' ? '📁' : '📄';
        container.innerHTML += `
          <div class="file-tree-item" style="padding-left:24px;">
            <div class="name">${icon} ${escapeHtml(item.name)} <span style="color:#8b949e;font-size:11px;">(${(item.size / 1024).toFixed(1)} KB)</span></div>
            <div class="actions">

              ${item.type === 'file' ? `<button class="btn btn--sm btn--danger" onclick="deleteFile('${escapeHtml(item.path)}')">删除</button>` : ''}
            </div>
          </div>
        `;
      });
    }
  } catch(e) {}
}

function showUploadFile() { document.getElementById('uploadFileForm').style.display = 'block'; }

async function uploadFile() {
  const input = document.getElementById('uploadFileInput');
  const targetDir = document.getElementById('uploadTargetDir').value;
  if (!input.files || input.files.length === 0) { showToast('请选择文件', 'error'); return; }
  const file = input.files[0];
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const path = targetDir + file.name;
      await ghPut(`/repos/${ORG}/${fileTool}/contents/${path}`, {
        message: `feat: 上传文件 ${file.name}（通过管理后台）`,
        content: btoa(unescape(encodeURIComponent(e.target.result))),
        branch: 'main'
      });
      showToast('文件上传成功', 'success');
      document.getElementById('uploadFileForm').style.display = 'none';
      await loadToolFiles();
    } catch(err) { showToast('上传失败：' + err.message, 'error'); }
  };
  reader.readAsBinaryString(file);
}

async function replaceFile(path) {
  const input = document.createElement('input');
  input.type = 'file';
  input.onchange = async () => {
    if (!input.files[0]) return;
    const file = input.files[0];
    showConfirm('替换文件', `确定要用 <strong>${escapeHtml(file.name)}</strong> 替换 <code>${escapeHtml(path)}</code> 吗？`, async () => {
      try {
        const existing = await ghGet(`/repos/${ORG}/${fileTool}/contents/${path}`);
        const reader = new FileReader();
        reader.onload = async (e) => {
          try {
            await ghPut(`/repos/${ORG}/${fileTool}/contents/${path}`, {
              message: `feat: 替换文件 ${path}（通过管理后台）`,
              content: btoa(unescape(encodeURIComponent(e.target.result))),
              sha: existing.sha,
              branch: 'main'
            });
            showToast('文件替换成功', 'success');
            await loadToolFiles();
          } catch(err) { showToast('替换失败：' + err.message, 'error'); }
        };
        reader.readAsBinaryString(file);
      } catch(err) { showToast('读取失败：' + err.message, 'error'); }
    }, { danger: true });
  };
  input.click();
}

async function deleteFile(path) {
  showConfirm('删除文件', `确定要删除 <code>${escapeHtml(path)}</code> 吗？此操作不可恢复。`, async () => {
    try {
      const existing = await ghGet(`/repos/${ORG}/${fileTool}/contents/${path}`);
      await ghDelete(`/repos/${ORG}/${fileTool}/contents/${path}?sha=${existing.sha}&message=delete: ${path}`);
      showToast('文件已删除', 'success');
      await loadToolFiles();
    } catch(e) { showToast('删除失败：' + e.message, 'error'); }
  }, { danger: true });
}

  let html = '<table class="table"><thead><tr><th>工具名称</th><th>描述</th><th>创建时间</th><th>操作</th></tr></thead><tbody>';

async function deleteTool(repo) {
  showConfirm('删除工具仓库',
    `确定要删除 <strong>${escapeHtml(repo)}</strong> 吗？<br><br>此操作不可恢复！删除后：<br>• 工具仓库永久删除<br>• 对应 Issue 自动标记"已下线"并关闭<br><br>请在下方输入 <code>${escapeHtml(repo)}</code> 确认。`,
    async () => {
      try {
        let issueNumber = null;
        try {
          const issues = await ghGet(`/repos/${ORG}/${UPLOAD_REPO}/issues?state=all&per_page=100`);
          const matched = issues.find(i => i.title && i.title.includes(repo));
          if (matched) issueNumber = matched.number;
        } catch(e) {}
        await ghDelete(`/repos/${ORG}/${repo}`);
        showToast(`仓库 ${repo} 已删除`, 'success');
        if (issueNumber) {
          try {
            try { await ghGet(`/repos/${ORG}/${UPLOAD_REPO}/labels/已下线`); }
            catch(e) {
              await ghPost(`/repos/${ORG}/${UPLOAD_REPO}/labels`, { name: '已下线', color: '6e7781', description: '该工具已被管理员删除' });
            }
            await ghPost(`/repos/${ORG}/${UPLOAD_REPO}/issues/${issueNumber}/labels`, { labels: ['已下线'] });
            await ghPost(`/repos/${ORG}/${UPLOAD_REPO}/issues/${issueNumber}/comments`, {
              body: `该工具已于 ${new Date().toLocaleString('zh-CN')} 由管理员 @${currentUser.login} 删除。`
            });
            await ghPatch(`/repos/${ORG}/${UPLOAD_REPO}/issues/${issueNumber}`, { state: 'closed' });
            showToast(`对应 Issue #${issueNumber} 已标记为"已下线"并关闭`, 'info');
          } catch(e) { showToast('Issue 标记失败：' + e.message, 'error'); }
        }
        await loadDeleteTools();
      } catch(e) { showToast('删除失败：' + e.message, 'error'); }
    },
    { danger: true, confirmText: repo, confirmBtnText: '确认删除' }
  );
}

async function renderIssues() {
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="content__title">📋 上传记录</div>
    <div class="search-box">
      <input type="text" id="issueSearch" placeholder="搜索工具名称..." oninput="filterIssues()">

  `;
  await loadIssues();
}

let allIssues = [];

async function loadIssues() {
  try {
    const issues = await ghGet(`/repos/${ORG}/${UPLOAD_REPO}/issues?state=all&per_page=100&sort=created&direction=desc`);
    allIssues = issues.filter(i => !i.pull_request);
    renderIssuesList(allIssues);
  } catch(e) {
    document.getElementById('issuesList').innerHTML = `<div class="empty">加载失败：${escapeHtml(e.message)}</div>`;
  }
}

function renderIssuesList(issues) {
  const list = document.getElementById('issuesList');
  if (issues.length === 0) { list.innerHTML = '<div class="empty">没有上传记录</div>'; return; }
  let html = '<table class="table"><thead><tr><th>#</th><th>工具名称</th><th>上传者</th><th>状态</th><th>标签</th><th>创建时间</th><th>操作</th></tr></thead><tbody>';
  issues.forEach(issue => {
    const stateTag = issue.state === 'open' ? '<span class="tag tag--func">进行中</span>' : '<span class="tag tag--offline">已关闭</span>';
    const labels = (issue.labels || []).map(l => `<span class="tag ${l.name === '已下线' ? 'tag--offline' : 'tag--dept'}">${escapeHtml(l.name)}</span>`).join('');
    const toolName = issue.title ? issue.title.replace('[上传工具]:', '').trim() : '-';
    html += `<tr><td>#${issue.number}</td><td><strong>${escapeHtml(toolName)}</strong></td><td>${escapeHtml(issue.user.login)}</td><td>${stateTag}</td><td>${labels || '-'}</td><td>${formatDate(issue.created_at)}</td><td><a class="btn btn--sm" href="${issue.html_url}" target="_blank">查看</a> ${issue.state === 'open' ? `<button class="btn btn--sm" onclick="closeIssue(${issue.number})">关闭</button>` : `<button class="btn btn--sm" onclick="reopenIssue(${issue.number})">重开</button>`}</td></tr>`;
  });
  html += '</tbody></table>';
  list.innerHTML = html;
}

function filterIssues() {
  const keyword = document.getElementById('issueSearch').value.toLowerCase();
  const state = document.getElementById('issueStateFilter').value;
  let filtered = allIssues;
  if (keyword) filtered = filtered.filter(i => (i.title || '').toLowerCase().includes(keyword));
  if (state !== 'all') filtered = filtered.filter(i => i.state === state);
  renderIssuesList(filtered);
}

async function closeIssue(num) {
  showConfirm('关闭 Issue', `确定要关闭 Issue #${num} 吗？`, async () => {
    try {
      await ghPatch(`/repos/${ORG}/${UPLOAD_REPO}/issues/${num}`, { state: 'closed' });
      showToast(`Issue #${num} 已关闭`, 'success');
      await loadIssues();
    } catch(e) { showToast('关闭失败：' + e.message, 'error'); }
  });
}

async function reopenIssue(num) {
  try {
    await ghPatch(`/repos/${ORG}/${UPLOAD_REPO}/issues/${num}`, { state: 'open' });
    showToast(`Issue #${num} 已重新打开`, 'success');
    await loadIssues();
  } catch(e) { showToast('重开失败：' + e.message, 'error'); }
}
