<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工具管理后台 · TAXLY WorkTools</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f6f8fa; color: #24292f; font-size: 14px; line-height: 1.6;
  }
  .topbar {
    background: #24292f; color: #fff; padding: 12px 24px;
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 100;
  }
  .topbar__title { font-size: 16px; font-weight: 600; }
  .topbar__title span { color: #58a6ff; }
  .topbar__right { display: flex; align-items: center; gap: 12px; }
  .token-status { font-size: 12px; padding: 4px 10px; border-radius: 12px; background: rgba(255,255,255,0.1); }
  .token-status.ok { background: #238636; }
  .token-status.no { background: #6e7681; }
  .btn {
    padding: 6px 14px; border: 1px solid #d0d7de; border-radius: 6px;
    background: #f6f8fa; cursor: pointer; font-size: 13px; transition: background 0.15s;
  }
  .btn:hover { background: #eaeef2; }
  .btn--primary { background: #2da44e; color: #fff; border-color: #2da44e; }
  .btn--primary:hover { background: #22863a; }
  .btn--danger { background: #cf222e; color: #fff; border-color: #cf222e; }
  .btn--danger:hover { background: #a40e26; }
  .btn--sm { padding: 4px 10px; font-size: 12px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .main { display: flex; min-height: calc(100vh - 52px); }
  .sidebar {
    width: 200px; background: #fff; border-right: 1px solid #d0d7de;
    padding: 16px 0; flex-shrink: 0;
  }
  .menu-item {
    padding: 10px 20px; cursor: pointer; font-size: 14px; color: #24292f;
    display: flex; align-items: center; gap: 8px; transition: background 0.15s;
    border-left: 3px solid transparent;
  }
  .menu-item:hover { background: #f6f8fa; }
  .menu-item.active { background: #ddf4ff; color: #0969da; border-left-color: #0969da; font-weight: 500; }
  .content { flex: 1; padding: 24px; min-width: 0; }
  .content__title { font-size: 20px; font-weight: 600; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #d0d7de; }
  .card { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 16px 20px; margin-bottom: 16px; }
  .card__title { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: #1f2328; }
  .card__desc { font-size: 12px; color: #57606a; margin-bottom: 12px; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-weight: 500; font-size: 13px; margin-bottom: 4px; color: #424a53; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 8px 12px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 13px; font-family: inherit;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none; border-color: #0969da; box-shadow: 0 0 0 3px rgba(9,105,218,0.15);
  }
  .table {
    width: 100%; border-collapse: collapse; background: #fff;
    border: 1px solid #d0d7de; border-radius: 8px; overflow: hidden;
  }
  .table th, .table td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #f0f1f3; font-size: 13px; }
  .table th { background: #f6f8fa; font-weight: 600; color: #424a53; }
  .table tr:last-child td { border-bottom: none; }
  .table tr:hover { background: #f6f8fa; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; margin-right: 4px; }
  .tag--dept { background: #ddf4ff; color: #0969da; }
  .tag--func { background: #dafbe1; color: #116329; }
  .tag--custom { background: #fff8c5; color: #9a6700; }
  .tag--offline { background: #eaeef2; color: #57606a; }
  .search-box { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; }
  .search-box input { flex: 1; padding: 8px 12px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 13px; }
  .toast {
    position: fixed; top: 70px; right: 24px; padding: 12px 20px; border-radius: 8px; color: #fff; font-size: 14px;
    z-index: 1000; opacity: 0; transform: translateY(-10px); transition: opacity 0.2s, transform 0.2s; max-width: 400px;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.success { background: #1a7f37; }
  .toast.error { background: #cf222e; }
  .toast.info { background: #0969da; }
  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5);
    z-index: 200; justify-content: center; align-items: center;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 12px; padding: 24px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; }
  .modal__title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
  .modal__actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .loading { text-align: center; padding: 40px; color: #8b949e; }
  .loading::after {
    content: ''; display: inline-block; width: 20px; height: 20px; border: 2px solid #d0d7de;
    border-top-color: #0969da; border-radius: 50%; animation: spin 0.8s linear infinite; margin-left: 10px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; padding: 40px; color: #8b949e; font-style: italic; }
  .section-divider {
    margin: 24px 0 16px; padding: 8px 12px; background: #f6f8fa; border-radius: 6px;
    font-weight: 600; font-size: 14px; color: #424a53;
    display: flex; justify-content: space-between; align-items: center;
  }
  .checkbox-group { display: flex; flex-wrap: wrap; gap: 8px; }
  .checkbox-item {
    display: flex; align-items: center; gap: 6px; padding: 6px 12px;
    border: 1px solid #d0d7de; border-radius: 6px; cursor: pointer; transition: all 0.15s;
  }
  .checkbox-item:hover { background: #f6f8fa; }
  .checkbox-item.checked { background: #ddf4ff; border-color: #0969da; }
  .checkbox-item input { cursor: pointer; }
  @media (max-width: 768px) {
    .main { flex-direction: column; }
    .sidebar { width: 100%; display: flex; overflow-x: auto; padding: 8px; }
    .menu-item { white-space: nowrap; border-left: none; border-bottom: 3px solid transparent; }
    .menu-item.active { border-bottom-color: #0969da; border-left: none; }
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar__title">🔧 <span>TAXLY WorkTools</span> · 工具管理后台</div>
  <div class="topbar__right">
    <span class="token-status no" id="tokenStatus">未认证</span>
    <button class="btn btn--sm" onclick="showTokenModal()">设置 Token</button>
  </div>
</div>
<div class="main">
  <div class="sidebar">
    <div class="menu-item active" data-module="labels" onclick="switchModule('labels')">📑 标签管理</div>
    <div class="menu-item" data-module="issues" onclick="switchModule('issues')">📋 上传记录</div>
  </div>
  <div class="content" id="content"><div class="loading">请先设置 GitHub Token</div></div>
</div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="tokenModal">
  <div class="modal">
    <div class="modal__title">🔑 设置 GitHub Token</div>
    <p style="margin-bottom:12px; font-size:13px; color:#57606a;">
      需要具有 <strong>repo</strong> 权限的 Personal Access Token (PAT)。<br>
      Token 仅保存在您的浏览器 localStorage 中，不会上传到任何服务器。
    </p>
    <div class="form-group"><label>Token</label><input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx"></div>
    <div class="modal__actions">
      <button class="btn" onclick="closeTokenModal()">取消</button>
      <button class="btn btn--primary" onclick="saveToken()">保存并验证</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="confirmModal">
  <div class="modal">
    <div class="modal__title" id="confirmTitle">确认操作</div>
    <div id="confirmBody" style="margin-bottom:12px;"></div>
    <div class="modal__actions">
      <button class="btn" onclick="closeConfirmModal()">取消</button>
      <button class="btn btn--danger" id="confirmBtn" onclick="executeConfirm()">确认</button>
    </div>
  </div>
</div>
<script>
const ORG = 'TAXLY-WorkTools';
const TOOLHUB_REPO = 'toolhub';
const UPLOAD_REPO = 'upload-portal';
let currentToken = localStorage.getItem('admin_token') || '';
let currentUser = null;
let currentModule = 'labels';
let confirmCallback = null;
let labelsData = null;
let labelsSha = null;

function showToast(msg, type = 'info') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast ' + type + ' show';
  setTimeout(() => { toast.className = 'toast ' + type; }, 3000);
}
function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
function formatDate(isoStr) {
  if (!isoStr) return '-';
  return new Date(isoStr).toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
}
async function ghApi(path, options = {}) {
  if (!currentToken) throw new Error('请先设置 GitHub Token');
  const url = path.startsWith('http') ? path : `https://api.github.com${path}`;
  const headers = { 'Authorization': `token ${currentToken}`, 'Accept': 'application/vnd.github.v3+json', ...options.headers };
  if (options.body && typeof options.body === 'object') { headers['Content-Type'] = 'application/json'; options.body = JSON.stringify(options.body); }
  const resp = await fetch(url, { ...options, headers });
  if (!resp.ok) {
    let errMsg = `HTTP ${resp.status}`;
    try { const errData = await resp.json(); errMsg = errData.message || errMsg; } catch(e) {}
    throw new Error(errMsg);
  }
  if (resp.status === 204) return null;
  return resp.json();
}
async function ghGet(path) { return ghApi(path); }
async function ghPut(path, body) { return ghApi(path, { method: 'PUT', body }); }
async function ghPost(path, body) { return ghApi(path, { method: 'POST', body }); }
async function ghDelete(path) { return ghApi(path, { method: 'DELETE' }); }
async function ghPatch(path, body) { return ghApi(path, { method: 'PATCH', body }); }

function showTokenModal() { document.getElementById('tokenInput').value = currentToken; document.getElementById('tokenModal').classList.add('show'); }
function closeTokenModal() { document.getElementById('tokenModal').classList.remove('show'); }
async function saveToken() {
  const token = document.getElementById('tokenInput').value.trim();
  if (!token) { showToast('请输入 Token', 'error'); return; }
  currentToken = token;
  try {
    const user = await ghGet('/user');
    currentUser = user;
    localStorage.setItem('admin_token', token);
    updateTokenStatus();
    closeTokenModal();
    showToast(`认证成功：${user.login}`, 'success');
    switchModule(currentModule);
  } catch(e) { showToast('Token 验证失败：' + e.message, 'error'); currentToken = ''; }
}
function updateTokenStatus() {
  const el = document.getElementById('tokenStatus');
  if (currentToken && currentUser) { el.textContent = `✅ ${currentUser.login}`; el.className = 'token-status ok'; }
  else { el.textContent = '未认证'; el.className = 'token-status no'; }
}
async function initToken() {
  if (currentToken) {
    try {
      const user = await ghGet('/user');
      currentUser = user;
      updateTokenStatus();
      switchModule(currentModule);
      return;
    } catch(e) { currentToken = ''; localStorage.removeItem('admin_token'); }
  }
  document.getElementById('content').innerHTML = '<div class="empty">请先点击右上角"设置 Token"进行认证</div>';
}
function showConfirm(title, body, callback, options = {}) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmBody').innerHTML = body;
  confirmCallback = callback;
  const confirmBtn = document.getElementById('confirmBtn');
  confirmBtn.className = 'btn ' + (options.danger ? 'btn--danger' : 'btn--primary');
  confirmBtn.textContent = options.confirmBtnText || '确认';
  document.getElementById('confirmModal').classList.add('show');
}
function closeConfirmModal() { document.getElementById('confirmModal').classList.remove('show'); confirmCallback = null; }
function executeConfirm() { closeConfirmModal(); if (confirmCallback) confirmCallback(); }
function switchModule(module) {
  currentModule = module;
  document.querySelectorAll('.menu-item').forEach(el => { el.classList.toggle('active', el.dataset.module === module); });
  if (!currentToken) { document.getElementById('content').innerHTML = '<div class="empty">请先设置 GitHub Token</div>'; return; }
  if (module === 'labels') renderLabels();
  else if (module === 'issues') renderIssues();
}

// 模块1：标签管理
async function renderLabels() {
  document.getElementById('content').innerHTML = `
    <div class="content__title">📑 标签管理</div>
    <div class="card">
      <div class="card__title">A. 标签定义管理</div>
      <div class="card__desc">管理 labels.json 中的标签定义（部门、功能、自定义类型）。修改后保存到 toolhub 仓库，上传脚本会自动读取。</div>
      <div id="labelsDefList" class="loading">加载中...</div>
    </div>
    <div class="card">
      <div class="card__title">B. 工具标签分配</div>
      <div class="card__desc">选择工具仓库，查看并修改其 GitHub Topics 标签。修改后立即生效，展示页下次构建后同步。</div>
      <div class="form-group"><label>选择工具仓库</label>
        <select id="toolRepoSelect" onchange="loadToolTopics()"><option value="">请选择工具...</option></select>
      </div>
      <div id="toolTopicsArea" style="display:none;">
        <div class="form-group"><label>当前标签（勾选/取消后保存）</label>
          <div class="checkbox-group" id="topicsCheckboxGroup"></div>
        </div>
        <div style="display:flex; gap:10px;"><button class="btn btn--primary" onclick="saveToolTopics()">💾 保存标签</button></div>
      </div>
    </div>`;
  await loadLabelsDef();
  await loadToolReposForSelect();
}
async function loadLabelsDef() {
  try {
    const data = await ghGet(`/repos/${ORG}/${TOOLHUB_REPO}/contents/labels.json`);
    labelsSha = data.sha;
    labelsData = JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\n/g, '')))));
    renderLabelsDefList();
  } catch(e) { document.getElementById('labelsDefList').innerHTML = `<div class="empty">加载失败：${escapeHtml(e.message)}</div>`; }
}
function renderLabelsDefList() {
  const container = document.getElementById('labelsDefList');
  if (!labelsData) { container.innerHTML = '<div class="empty">无数据</div>'; return; }
  let html = '';
  html += `<div class="section-divider"><span>🏢 部门标签 (departments)</span><button class="btn btn--sm" onclick="showAddLabelModal('dept')">+ 添加部门</button></div>`;
  html += '<table class="table"><thead><tr><th>标签 ID</th><th>中文名称</th><th>操作</th></tr></thead><tbody>';
  (labelsData.departments || []).forEach(l => {
    html += `<tr><td><code>${escapeHtml(l.id)}</code></td><td>${escapeHtml(l.name)}</td><td><button class="btn btn--sm btn--danger" onclick="deleteLabel('dept','${escapeHtml(l.id)}')">删除</button></td></tr>`;
  });
  html += '</tbody></table>';
  html += `<div class="section-divider" style="margin-top:20px;"><span>⚙️ 功能标签 (categories)</span><button class="btn btn--sm" onclick="showAddLabelModal('func')">+ 添加功能</button></div>`;
  html += '<table class="table"><thead><tr><th>标签 ID</th><th>中文名称</th><th>操作</th></tr></thead><tbody>';
  (labelsData.categories || []).forEach(l => {
    html += `<tr><td><code>${escapeHtml(l.id)}</code></td><td>${escapeHtml(l.name)}</td><td><button class="btn btn--sm btn--danger" onclick="deleteLabel('func','${escapeHtml(l.id)}')">删除</button></td></tr>`;
  });
  html += '</tbody></table>';
  const customTypes = labelsData.custom_types || [];
  html += `<div class="section-divider" style="margin-top:20px;"><span>🏷️ 自定义类型 (custom_types)</span><button class="btn btn--sm" onclick="showAddCustomTypeModal()">+ 添加类型</button></div>`;
  if (customTypes.length === 0) {
    html += '<div class="empty">暂无自定义类型，点击上方"添加类型"创建</div>';
  } else {
    customTypes.forEach((ct, idx) => {
      html += `<div style="margin-bottom:16px; border:1px solid #d0d7de; border-radius:8px; padding:12px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <strong>${escapeHtml(ct.name)} <code style="font-size:11px; color:#57606a;">(${escapeHtml(ct.key)})</code></strong>
          <div style="display:flex; gap:6px;">
            <button class="btn btn--sm" onclick="showAddLabelToCustomType(${idx})">+ 标签</button>
            <button class="btn btn--sm btn--danger" onclick="deleteCustomType(${idx})">删除类型</button>
          </div>
        </div>`;
      if (ct.labels && ct.labels.length > 0) {
        html += '<table class="table"><thead><tr><th>标签 ID</th><th>中文名称</th><th>操作</th></tr></thead><tbody>';
        ct.labels.forEach(l => {
          html += `<tr><td><code>${escapeHtml(l.id)}</code></td><td>${escapeHtml(l.name)}</td><td><button class="btn btn--sm btn--danger" onclick="deleteLabelFromCustomType(${idx},'${escapeHtml(l.id)}')">删除</button></td></tr>`;
        });
        html += '</tbody></table>';
      } else { html += '<div style="padding:8px; color:#8b949e; font-size:12px;">暂无标签</div>'; }
      html += '</div>';
    });
  }
  container.innerHTML = html;
}
function showAddLabelModal(type) {
  const typeName = type === 'dept' ? '部门' : '功能';
  const prefix = type === 'dept' ? 'dept-' : 'func-';
  showConfirm(`添加${typeName}标签`,
    `<div class="form-group"><label>中文名称</label><input type="text" id="addLabelName" placeholder="如：审计部 / 数据分析"></div>
     <div class="form-group"><label>标签 ID（自动生成，可修改）</label><input type="text" id="addLabelId" placeholder="${prefix}xxx"></div>`,
    async () => {
      const name = document.getElementById('addLabelName').value.trim();
      let id = document.getElementById('addLabelId').value.trim();
      if (!name) { showToast('请输入中文名称', 'error'); return; }
      if (!id) id = prefix + name.toLowerCase().replace(/\s+/g, '-');
      const arr = type === 'dept' ? labelsData.departments : labelsData.categories;
      if (arr.some(l => l.id === id)) { showToast('标签 ID 已存在', 'error'); return; }
      arr.push({ id, name });
      await saveLabelsJson(`添加${typeName}标签: ${id}`);
    }, { confirmBtnText: '添加' });
  setTimeout(() => {
    const nameInput = document.getElementById('addLabelName');
    const idInput = document.getElementById('addLabelId');
    if (nameInput) {
      nameInput.oninput = () => {
        if (!idInput.value || idInput.value.startsWith(prefix)) {
          idInput.value = prefix + nameInput.value.toLowerCase().replace(/\s+/g, '-');
        }
      };
    }
  }, 100);
}
function showAddCustomTypeModal() {
  showConfirm('添加自定义标签类型',
    `<div class="form-group"><label>类型名称（中文）</label><input type="text" id="addTypeName" placeholder="如：难度、状态、优先级"></div>
     <div class="form-group"><label>类型 Key（英文前缀）</label><input type="text" id="addTypeKey" placeholder="如：level、status、priority"></div>`,
    async () => {
      const name = document.getElementById('addTypeName').value.trim();
      const key = document.getElementById('addTypeKey').value.trim();
      if (!name || !key) { showToast('请填写类型名称和 Key', 'error'); return; }
      if (!labelsData.custom_types) labelsData.custom_types = [];
      if (labelsData.custom_types.some(ct => ct.key === key)) { showToast('类型 Key 已存在', 'error'); return; }
      labelsData.custom_types.push({ key, name, labels: [] });
      await saveLabelsJson(`添加自定义标签类型: ${key}`);
    }, { confirmBtnText: '添加' });
}
function showAddLabelToCustomType(typeIdx) {
  const ct = labelsData.custom_types[typeIdx];
  showConfirm(`添加标签到「${ct.name}」`,
    `<div class="form-group"><label>中文名称</label><input type="text" id="addCustomLabelName" placeholder="如：简单 / 进行中"></div>
     <div class="form-group"><label>标签 ID</label><input type="text" id="addCustomLabelId" placeholder="${ct.key}-xxx"></div>`,
    async () => {
      const name = document.getElementById('addCustomLabelName').value.trim();
      let id = document.getElementById('addCustomLabelId').value.trim();
      if (!name) { showToast('请输入中文名称', 'error'); return; }
      if (!id) id = `${ct.key}-` + name.toLowerCase().replace(/\s+/g, '-');
      if (ct.labels.some(l => l.id === id)) { showToast('标签 ID 已存在', 'error'); return; }
      ct.labels.push({ id, name });
      await saveLabelsJson(`添加标签到 ${ct.key}: ${id}`);
    }, { confirmBtnText: '添加' });
}
function deleteLabel(type, id) {
  const typeName = type === 'dept' ? '部门' : '功能';
  showConfirm(`删除${typeName}标签`, `确定要删除标签 <code>${escapeHtml(id)}</code> 吗？`, async () => {
    const arr = type === 'dept' ? labelsData.departments : labelsData.categories;
    const idx = arr.findIndex(l => l.id === id);
    if (idx >= 0) arr.splice(idx, 1);
    await saveLabelsJson(`删除${typeName}标签: ${id}`);
  }, { danger: true });
}
function deleteCustomType(idx) {
  const ct = labelsData.custom_types[idx];
  showConfirm('删除自定义类型', `确定要删除类型「${escapeHtml(ct.name)}」及其所有标签吗？`, async () => {
    labelsData.custom_types.splice(idx, 1);
    await saveLabelsJson(`删除自定义类型: ${ct.key}`);
  }, { danger: true });
}
function deleteLabelFromCustomType(typeIdx, id) {
  showConfirm('删除标签', `确定要删除标签 <code>${escapeHtml(id)}</code> 吗？`, async () => {
    const ct = labelsData.custom_types[typeIdx];
    const idx = ct.labels.findIndex(l => l.id === id);
    if (idx >= 0) ct.labels.splice(idx, 1);
    await saveLabelsJson(`删除标签: ${id}`);
  }, { danger: true });
}
async function saveLabelsJson(commitMsg) {
  try {
    const content = JSON.stringify(labelsData, null, 2) + '\n';
    await ghPut(`/repos/${ORG}/${TOOLHUB_REPO}/contents/labels.json`, {
      message: commitMsg,
      content: btoa(unescape(encodeURIComponent(content))),
      sha: labelsSha, branch: 'main'
    });
    showToast('labels.json 已保存', 'success');
    await loadLabelsDef();
  } catch(e) { showToast('保存失败：' + e.message, 'error'); }
}

// B. 工具标签分配
let allToolRepos = [];
let currentToolRepo = null;
let currentToolTopics = [];
async function loadToolReposForSelect() {
  try {
    const repos = await ghGet(`/orgs/${ORG}/repos?per_page=100&sort=updated`);
    allToolRepos = repos.filter(r => !['toolhub', 'upload-portal', 'tool-template'].includes(r.name));
    const select = document.getElementById('toolRepoSelect');
    select.innerHTML = '<option value="">请选择工具...</option>';
    allToolRepos.forEach(r => {
      select.innerHTML += `<option value="${escapeHtml(r.name)}">${escapeHtml(r.name)} — ${escapeHtml(r.description || '')}</option>`;
    });
  } catch(e) { showToast('加载工具列表失败：' + e.message, 'error'); }
}
async function loadToolTopics() {
  const repoName = document.getElementById('toolRepoSelect').value;
  if (!repoName) { document.getElementById('toolTopicsArea').style.display = 'none'; return; }
  currentToolRepo = repoName;
  try {
    const repo = await ghGet(`/repos/${ORG}/${repoName}`);
    currentToolTopics = repo.topics || [];
    renderTopicsCheckboxes();
    document.getElementById('toolTopicsArea').style.display = 'block';
  } catch(e) { showToast('加载工具标签失败：' + e.message, 'error'); }
}
function renderTopicsCheckboxes() {
  const container = document.getElementById('topicsCheckboxGroup');
  const allLabels = [];
  (labelsData?.departments || []).forEach(l => allLabels.push({ ...l, type: 'dept' }));
  (labelsData?.categories || []).forEach(l => allLabels.push({ ...l, type: 'func' }));
  (labelsData?.custom_types || []).forEach(ct => { (ct.labels || []).forEach(l => allLabels.push({ ...l, type: 'custom', typeName: ct.name })); });
  currentToolTopics.forEach(t => {
    if (!allLabels.some(l => l.id === t)) { allLabels.push({ id: t, name: t + ' (未定义)', type: 'unknown' }); }
  });
  let html = '';
  allLabels.forEach(l => {
    const checked = currentToolTopics.includes(l.id);
    const cls = l.type === 'dept' ? 'tag--dept' : l.type === 'func' ? 'tag--func' : l.type === 'custom' ? 'tag--custom' : 'tag--offline';
    html += `<label class="checkbox-item ${checked ? 'checked' : ''}">
      <input type="checkbox" value="${escapeHtml(l.id)}" ${checked ? 'checked' : ''} onchange="this.parentElement.classList.toggle('checked', this.checked)">
      <span class="tag ${cls}">${escapeHtml(l.name)}</span>
      <code style="font-size:11px; color:#57606a;">${escapeHtml(l.id)}</code>
    </label>`;
  });
  container.innerHTML = html;
}
async function saveToolTopics() {
  const checkboxes = document.querySelectorAll('#topicsCheckboxGroup input[type="checkbox"]');
  const newTopics = [];
  checkboxes.forEach(cb => { if (cb.checked) newTopics.push(cb.value); });
  try {
    await ghPut(`/repos/${ORG}/${currentToolRepo}/topics`, { names: newTopics });
    showToast(`工具 ${currentToolRepo} 的标签已更新`, 'success');
    currentToolTopics = newTopics;
  } catch(e) { showToast('保存失败：' + e.message, 'error'); }
}

// 模块2：上传记录
async function renderIssues() {
  document.getElementById('content').innerHTML = `
    <div class="content__title">📋 上传记录</div>
    <div class="search-box">
      <input type="text" id="issueSearch" placeholder="搜索工具名称..." oninput="filterIssues()">
      <select id="issueStateFilter" onchange="filterIssues()"><option value="all">全部状态</option><option value="open">进行中</option><option value="closed">已关闭</option></select>
    </div>
    <div id="issuesList" class="loading">加载中...</div>`;
  await loadIssues();
}
let allIssues = [];
async function loadIssues() {
  try {
    const issues = await ghGet(`/repos/${ORG}/${UPLOAD_REPO}/issues?state=all&per_page=100&sort=created&direction=desc`);
    allIssues = issues.filter(i => !i.pull_request);
    renderIssuesList(allIssues);
  } catch(e) { document.getElementById('issuesList').innerHTML = `<div class="empty">加载失败：${escapeHtml(e.message)}</div>`; }
}
function renderIssuesList(issues) {
  const list = document.getElementById('issuesList');
  if (issues.length === 0) { list.innerHTML = '<div class="empty">没有上传记录</div>'; return; }
  let html = '<table class="table"><thead><tr><th>#</th><th>工具名称</th><th>上传者</th><th>状态</th><th>标签</th><th>创建时间</th><th>操作</th></tr></thead><tbody>';
  issues.forEach(issue => {
    const stateTag = issue.state === 'open' ? '<span class="tag tag--func">进行中</span>' : '<span class="tag tag--offline">已关闭</span>';
    const labels = (issue.labels || []).map(l => `<span class="tag ${l.name === '已下线' ? 'tag--offline' : 'tag--dept'}">${escapeHtml(l.name)}</span>`).join('');
    const toolName = issue.title ? issue.title.replace('[上传工具]:', '').trim() : '-';
    html += `<tr><td>#${issue.number}</td><td><strong>${escapeHtml(toolName)}</strong></td><td>${escapeHtml(issue.user.login)}</td><td>${stateTag}</td><td>${labels || '-'}</td><td>${formatDate(issue.created_at)}</td><td><a class="btn btn--sm" href="${issue.html_url}" target="_blank">查看</a> ${issue.state === 'open' ? `<button class="btn btn--sm" onclick="closeIssue(${issue.number})">关闭</button>` : `<button class="btn btn--sm" onclick="reopenIssue(${issue.number})">重开</button>`}</td></tr>`;
  });
  html += '</tbody></table>';
  list.innerHTML = html;
}
function filterIssues() {
  const keyword = document.getElementById('issueSearch').value.toLowerCase();
  const state = document.getElementById('issueStateFilter').value;
  let filtered = allIssues;
  if (keyword) filtered = filtered.filter(i => (i.title || '').toLowerCase().includes(keyword));
  if (state !== 'all') filtered = filtered.filter(i => i.state === state);
  renderIssuesList(filtered);
}
async function closeIssue(num) {
  showConfirm('关闭 Issue', `确定要关闭 Issue #${num} 吗？`, async () => {
    try { await ghPatch(`/repos/${ORG}/${UPLOAD_REPO}/issues/${num}`, { state: 'closed' }); showToast(`Issue #${num} 已关闭`, 'success'); await loadIssues(); }
    catch(e) { showToast('关闭失败：' + e.message, 'error'); }
  });
}
async function reopenIssue(num) {
  try { await ghPatch(`/repos/${ORG}/${UPLOAD_REPO}/issues/${num}`, { state: 'open' }); showToast(`Issue #${num} 已重新打开`, 'success'); await loadIssues(); }
  catch(e) { showToast('重开失败：' + e.message, 'error'); }
}
initToken();
