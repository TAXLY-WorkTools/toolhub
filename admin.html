<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工具管理后台 · TAXLY WorkTools</title>
<style>
  :root {
    --card: #FFFFFF;
    --bg: #F7F8FA;
    --border-lt: #EEF1F5;
    --border: #E4E9EF;
    --text-3: #A8B4C0;
    --text-2: #7A8899;
    --text: #3A4758;
    --accent-lt: #7A8899;
    --accent: #5A6878;
    --accent-hover: #4E5C6C;
    --accent-dark: #3A4758;
    --success-lt: #B4C0B8;
    --success: #5E7868;
    --success-bg: #F0F4F1;
    --info-lt: #B4BEC8;
    --info: #5E7488;
    --info-bg: #F0F2F5;
    --warning-lt: #D0C8B0;
    --warning: #8A7860;
    --warning-bg: #F4F1EC;
    --danger-lt: #D0B8B8;
    --danger: #8A6262;
    --danger-bg: #F4F0F0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background-color: var(--bg); background-image: linear-gradient(135deg, rgba(90,104,120,0.03) 25%, transparent 25%), linear-gradient(225deg, rgba(90,104,120,0.03) 25%, transparent 25%), linear-gradient(45deg, rgba(90,104,120,0.02) 25%, transparent 25%), linear-gradient(315deg, rgba(90,104,120,0.02) 25%, transparent 25%); background-size: 20px 20px; background-position: 0 0, 10px 0, 10px -10px, 0px 10px; color: var(--text); font-size: 14px; line-height: 1.6; }
  .topbar { background: rgba(255,255,255,0.85); backdrop-filter: blur(12px) saturate(180%); -webkit-backdrop-filter: blur(12px) saturate(180%); border-bottom: 2px solid var(--accent-dark); padding: 0 32px; height: 56px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; max-width: 1680px; margin: 0 auto; }
  .topbar__title { font-size: 16px; font-weight: 700; color: var(--accent-dark); display: flex; align-items: center; gap: 8px; }
  .topbar__title span { color: var(--accent); }
  .topbar__right { display: flex; align-items: center; gap: 12px; }
  .token-status { font-size: 12px; padding: 4px 10px; border-radius: 12px; background: rgba(90,104,120,0.1); color: var(--text-2); }
  .token-status.ok { background: var(--success); color: #fff; }
  .token-status.no { background: var(--border); color: var(--text-3); }
  .btn { padding: 6px 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); cursor: pointer; font-size: 13px; transition: all 0.15s; font-family: inherit; color: var(--text); }
  .btn:hover { background: rgba(90,104,120,0.08); border-color: var(--accent-lt); }
  .btn--primary { background: var(--success); color: #fff; border-color: var(--success); }
  .btn--primary:hover { background: #4E6858; }
  .btn--danger { background: var(--danger); color: #fff; border-color: var(--danger); }
  .btn--danger:hover { background: #7A5252; }
  .btn--sm { padding: 4px 10px; font-size: 12px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .main { display: flex; min-height: calc(100vh - 56px); max-width: 1680px; margin: 0 auto; }
  .sidebar { width: 180px; background: rgba(255,255,255,0.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-right: 1px solid var(--border); padding: 16px 0; flex-shrink: 0; }
  .menu-item { padding: 12px 20px; cursor: pointer; font-size: 13px; color: var(--text); display: flex; align-items: center; gap: 8px; transition: all 0.15s; border-left: 3px solid transparent; }
  .menu-item:hover { background: rgba(90,104,120,0.08); }
  .menu-item.active { background: rgba(94,120,104,0.1); color: var(--success); border-left-color: var(--success); font-weight: 600; }
  .menu-item .menu-icon { width: 20px; height: 20px; image-rendering: pixelated; }
  .content { flex: 1; padding: 32px 40px; min-width: 0; }
  .content__title { font-size: 20px; font-weight: 700; margin-bottom: 6px; padding-bottom: 12px; border-bottom: 1px solid var(--border); color: var(--accent-dark); display: flex; align-items: center; gap: 10px; }
  .content__title img { width: 28px; height: 28px; image-rendering: pixelated; }
  .content__desc { font-size: 13px; color: var(--text-2); margin-bottom: 20px; }
  .card { background: rgba(255,255,255,0.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 16px; transition: all 0.2s; }
  .card:hover { border-color: var(--accent-lt); box-shadow: 0 4px 16px rgba(90,104,120,0.1); }
  .card__title { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: var(--accent-dark); display: flex; justify-content: space-between; align-items: center; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-weight: 500; font-size: 13px; margin-bottom: 4px; color: var(--text); }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit; background: var(--card); color: var(--text); }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(90,104,120,0.1); }
  .table { width: 100%; border-collapse: collapse; background: rgba(255,255,255,0.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; table-layout: fixed; }
  .table th, .table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border-lt); font-size: 13px; vertical-align: top; }
  .table th { background: rgba(90,104,120,0.08); font-weight: 600; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .table tr:last-child td { border-bottom: none; }
  .table tr:hover { background: rgba(90,104,120,0.05); }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; margin-right: 4px; margin-bottom: 4px; white-space: nowrap; }
  .tag--dept { background: var(--info-bg); color: var(--info); }
  .tag--func { background: var(--success-bg); color: var(--success); }
  .tag--tech { background: var(--danger-bg); color: var(--danger); }
  .tag--tutorial { background: var(--warning-bg); color: var(--warning); }
  .tag--size { background: var(--border-lt); color: var(--text-2); }
  .tag--custom { background: var(--warning-bg); color: var(--warning); }
  .tag--offline { background: var(--border-lt); color: var(--text-2); }
  .tags-cell { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .search-box { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; }
  .search-box input { flex: 1; max-width: 360px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; background: var(--card); color: var(--text); }
  .search-box select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; background: var(--card); color: var(--text); }
  .filter-bar { background: rgba(255,255,255,0.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 8px; padding: 16px 20px; margin-bottom: 16px; }
  .filter-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .filter-row:last-child { margin-bottom: 0; }
  .filter-row input[type="text"] { flex: 1; max-width: 360px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit; background: var(--card); color: var(--text); }
  .filter-row select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit; cursor: pointer; background: var(--card); color: var(--text); }
  .filter-count { font-size: 12px; color: var(--text-2); margin-left: auto; }
  .filter-count strong { color: var(--accent); }
  .tag-group { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
  .tag-group:last-child { margin-bottom: 0; }
  .tag-group__label { font-size: 12px; font-weight: 600; color: var(--text-2); min-width: 60px; padding-top: 5px; flex-shrink: 0; }
  .tag-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag-btn { padding: 4px 12px; border: 1px solid var(--border); border-radius: 14px; background: var(--card); cursor: pointer; font-size: 12px; transition: all 0.15s; font-family: inherit; color: var(--text); }
  .tag-btn:hover { background: rgba(90,104,120,0.08); border-color: var(--accent-lt); }
  .tag-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tag-btn.active:hover { background: var(--accent-hover); }
  .selected-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding-top: 10px; border-top: 1px solid var(--border-lt); margin-top: 4px; }
  .selected-tags__label { font-size: 12px; color: var(--text-2); font-weight: 500; }
  .selected-tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; background: var(--info-bg); border: 1px solid var(--info-lt); border-radius: 12px; font-size: 11px; color: var(--info); }
  .selected-tag .remove { cursor: pointer; font-weight: bold; opacity: 0.7; }
  .selected-tag .remove:hover { opacity: 1; }
  .clear-all { font-size: 11px; color: var(--danger); cursor: pointer; text-decoration: underline; margin-left: 4px; }
  .clear-all:hover { color: #7A5252; }
  .toast { position: fixed; top: 70px; right: 24px; padding: 12px 20px; border-radius: 8px; color: #fff; font-size: 14px; z-index: 1000; opacity: 0; transform: translateY(-10px); transition: opacity 0.2s, transform 0.2s; max-width: 400px; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--danger); }
  .toast.info { background: var(--accent); }
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 200; justify-content: center; align-items: center; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border-radius: 12px; padding: 24px; max-width: 560px; width: 90%; max-height: 80vh; overflow-y: auto; }
  .modal__title { font-size: 18px; font-weight: 600; margin-bottom: 16px; color: var(--accent-dark); }
  .modal__actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .loading { text-align: center; padding: 30px; color: var(--text-3); }
  .loading::after { content: ''; display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-left: 8px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; padding: 30px; color: var(--text-3); font-style: italic; font-size: 13px; }
  .checkbox-group { display: flex; flex-wrap: wrap; gap: 6px; }
  .checkbox-item { display: flex; align-items: center; gap: 4px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; transition: all 0.15s; font-size: 12px; background: var(--card); }
  .checkbox-item:hover { background: rgba(90,104,120,0.08); }
  .checkbox-item.checked { background: var(--info-bg); border-color: var(--info); }
  .checkbox-item input { cursor: pointer; }
  .warn-box { background: var(--warning-bg); border: 1px solid var(--warning-lt); border-radius: 6px; padding: 10px 14px; margin-bottom: 12px; font-size: 13px; color: var(--warning); }
  .usage-count { display: inline-block; padding: 1px 6px; border-radius: 10px; background: var(--border-lt); color: var(--text-2); font-size: 11px; font-weight: 600; }
  .usage-count.has { background: var(--info-bg); color: var(--info); }
  .tool-name { font-weight: 600; font-size: 13px; margin-bottom: 2px; word-break: break-all; }
  .tool-name a { color: var(--accent); text-decoration: none; }
  .tool-name a:hover { text-decoration: underline; }
  .tool-name-cn { font-size: 12px; color: var(--text-3); font-style: italic; padding-left: 2em; }
  .tool-name-cn.real { color: var(--success); font-weight: 500; }
  .tool-created { font-size: 11px; color: var(--text-3); padding-left: 2em; margin-top: 2px; }
  .tool-desc { font-size: 12px; color: var(--text-2); line-height: 1.6; word-wrap: break-word; word-break: break-word; overflow-wrap: break-word; }
  .action-cell { white-space: nowrap; text-align: center; }
  .state-cell { white-space: nowrap; }
  .pagination { display: flex; justify-content: center; gap: 4px; margin-top: 16px; }
  .pagination button { padding: 6px 12px; border: 1px solid var(--border); background: var(--card); border-radius: 6px; cursor: pointer; font-size: 12px; color: var(--text); }
  .pagination button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
  @media (max-width: 768px) { .main { flex-direction: column; } .sidebar { width: 100%; display: flex; overflow-x: auto; padding: 8px; } .menu-item { white-space: nowrap; border-left: none; border-bottom: 3px solid transparent; } .menu-item.active { border-bottom-color: var(--success); border-left: none; } .content { padding: 20px; } }
</style>
</head>
<body>
<div class="topbar">
  <div style="display:flex;align-items:center;gap:12px;">
    <a href="index.html" style="color:var(--accent);text-decoration:none;font-size:14px;display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:6px;transition:background 0.15s;">← 返回主页</a>
    <div class="topbar__title">
      <img src="static/icons/command_block.png" alt="logo" style="width:28px;height:28px;">
      <span>TAXLY WorkTools</span> · 工具管理后台
    </div>
  </div>
  <div class="topbar__right">
    <span class="token-status no" id="tokenStatus">未认证</span>
    <button class="btn btn--sm" onclick="showTokenModal()">设置 Token</button>
  </div>
</div>
<div class="main">
  <div class="sidebar">
    <div class="menu-item active" data-module="tools" onclick="switchModule('tools')">
      <img src="static/icons/spyglass.png" alt="标签" class="menu-icon"> 工具标签
    </div>
    <div class="menu-item" data-module="issues" onclick="switchModule('issues')">
      <img src="static/icons/book.png" alt="记录" class="menu-icon"> 上传记录
    </div>
  </div>
  <div class="content" id="content"><div class="loading">请先设置 GitHub Token</div></div>
</div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="tokenModal">
  <div class="modal">
    <div class="modal__title">设置 GitHub Token</div>
    <p style="margin-bottom:12px; font-size:13px; color:var(--text-2);">需要具有 <strong>repo</strong> 权限的 Personal Access Token (PAT)。<br>Token 仅保存在您的浏览器 localStorage 中，不会上传到任何服务器。</p>
    <div class="form-group"><label>Token</label><input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx"></div>
    <div class="modal__actions"><button class="btn" onclick="closeTokenModal()">取消</button><button class="btn btn--primary" onclick="saveToken()">保存并验证</button></div>
  </div>
</div>
<div class="modal-overlay" id="confirmModal">
  <div class="modal">
    <div class="modal__title" id="confirmTitle">确认操作</div>
    <div id="confirmBody" style="margin-bottom:12px;"></div>
    <div class="modal__actions"><button class="btn" onclick="closeConfirmModal()">取消</button><button class="btn btn--danger" id="confirmBtn" onclick="executeConfirm()">确认</button></div>
  </div>
</div>
<div class="modal-overlay" id="editTagsModal">
  <div class="modal">
    <div class="modal__title" id="editTagsTitle">编辑工具标签</div>
    <div id="editTagsBody"></div>
    <div class="modal__actions"><button class="btn" onclick="closeEditTagsModal()">取消</button><button class="btn btn--primary" onclick="saveEditTags()">保存</button></div>
  </div>
</div>
<script>
const ORG = 'TAXLY-WorkTools';
const TOOLHUB_REPO = 'toolhub';
const UPLOAD_REPO = 'upload-portal';
const PAGE_SIZE = 10;
let currentToken = localStorage.getItem('admin_token') || '';
let currentUser = null;
let currentModule = 'tools';
let confirmCallback = null;
let labelsData = null;
let labelsSha = null;
let allReposCache = null;
let labelUsageCache = {};
let currentEditTool = null;
let currentEditTopics = [];
let allToolReposData = [];
let currentPage = 1;
let allIssues = [];
let selectedFilterTags = { dept: [], func: [], tech: [], tutorial: [], size: [], custom: [] };
let currentSort = 'updated_desc';

function showToast(msg, type = 'info') { const toast = document.getElementById('toast'); toast.textContent = msg; toast.className = 'toast ' + type + ' show'; setTimeout(() => { toast.className = 'toast ' + type; }, 3000); }
function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
function formatDate(isoStr) { if (!isoStr) return '-'; return new Date(isoStr).toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }); }
function getToolCnName(repo) { if (repo.description) { const m = repo.description.match(/^【(.+?)】/); if (m) return { name: m[1], real: true }; const first20 = repo.description.substring(0, 20); return { name: first20 + (repo.description.length > 20 ? '...' : ''), real: false }; } return { name: repo.name, real: false }; }
async function ghApi(path, options = {}) { if (!currentToken) throw new Error('请先设置 GitHub Token'); const url = path.startsWith('http') ? path : `https://api.github.com${path}`; const headers = { 'Authorization': `token ${currentToken}`, 'Accept': 'application/vnd.github.v3+json', ...options.headers }; if (options.body && typeof options.body === 'object') { headers['Content-Type'] = 'application/json'; options.body = JSON.stringify(options.body); } const resp = await fetch(url, { ...options, headers }); if (!resp.ok) { let errMsg = `HTTP ${resp.status}`; try { const errData = await resp.json(); errMsg = errData.message || errMsg; } catch(e) {} throw new Error(errMsg); } if (resp.status === 204) return null; return resp.json(); }
async function ghGet(path) { return ghApi(path); }
async function ghPut(path, body) { return ghApi(path, { method: 'PUT', body }); }
async function ghPost(path, body) { return ghApi(path, { method: 'POST', body }); }
async function ghPatch(path, body) { return ghApi(path, { method: 'PATCH', body }); }

function showTokenModal() { document.getElementById('tokenInput').value = currentToken; document.getElementById('tokenModal').classList.add('show'); }
function closeTokenModal() { document.getElementById('tokenModal').classList.remove('show'); }
async function saveToken() { const token = document.getElementById('tokenInput').value.trim(); if (!token) { showToast('请输入 Token', 'error'); return; } currentToken = token; try { const user = await ghGet('/user'); currentUser = user; localStorage.setItem('admin_token', token); updateTokenStatus(); closeTokenModal(); showToast(`认证成功：${user.login}`, 'success'); switchModule(currentModule); } catch(e) { showToast('Token 验证失败：' + e.message, 'error'); currentToken = ''; } }
function updateTokenStatus() { const el = document.getElementById('tokenStatus'); if (currentToken && currentUser) { el.textContent = `${currentUser.login}`; el.className = 'token-status ok'; } else { el.textContent = '未认证'; el.className = 'token-status no'; } }
async function initToken() { if (currentToken) { try { const user = await ghGet('/user'); currentUser = user; updateTokenStatus(); switchModule(currentModule); return; } catch(e) { currentToken = ''; localStorage.removeItem('admin_token'); } } document.getElementById('content').innerHTML = '<div class="empty">请先点击右上角"设置 Token"进行认证</div>'; }
function showConfirm(title, body, callback, options = {}) { document.getElementById('confirmTitle').textContent = title; document.getElementById('confirmBody').innerHTML = body; confirmCallback = callback; const confirmBtn = document.getElementById('confirmBtn'); confirmBtn.className = 'btn ' + (options.danger ? 'btn--danger' : 'btn--primary'); confirmBtn.textContent = options.confirmBtnText || '确认'; document.getElementById('confirmModal').classList.add('show'); }
function closeConfirmModal() { document.getElementById('confirmModal').classList.remove('show'); confirmCallback = null; }
function executeConfirm() { closeConfirmModal(); if (confirmCallback) confirmCallback(); }

function switchModule(module) { currentModule = module; document.querySelectorAll('.menu-item').forEach(el => { el.classList.toggle('active', el.dataset.module === module); }); if (!currentToken) { document.getElementById('content').innerHTML = '<div class="empty">请先设置 GitHub Token</div>'; return; } if (module === 'tools') renderTools(); else if (module === 'issues') renderIssues(); }

async function getAllToolRepos(forceRefresh = false) { if (allReposCache && !forceRefresh) return allReposCache; const repos = await ghGet(`/orgs/${ORG}/repos?per_page=100&sort=updated`); allReposCache = repos.filter(r => !['toolhub', 'upload-portal', 'tool-template'].includes(r.name)); return allReposCache; }

function getTypeDisplayName(typeKey) { if (labelsData && labelsData.type_config && labelsData.type_config[typeKey]) { return labelsData.type_config[typeKey].display_name; } return typeKey === 'dept' ? '使用部门' : typeKey === 'func' ? '功能分类' : typeKey === 'tech' ? '技术栈' : typeKey === 'tutorial' ? '是否有教程' : typeKey === 'size' ? '文件大小' : typeKey; }

async function loadLabelsDef() { try { const data = await ghGet(`/repos/${ORG}/${TOOLHUB_REPO}/contents/labels.json`); labelsSha = data.sha; labelsData = JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))))); } catch(e) { console.warn('加载 labels.json 失败:', e); } }

async function renderTools() { currentPage = 1; selectedFilterTags = { dept: [], func: [], tech: [], tutorial: [], size: [], custom: [] }; currentSort = 'updated_desc'; document.getElementById('content').innerHTML = `<div class="content__title"><img src="static/icons/spyglass.png" alt="标签"> 工具标签分配</div><div class="content__desc">点击工具名称直达 GitHub 仓库（新窗口）。点击标签按钮多选筛选，同类型为"或"、跨类型为"且"。</div><div class="filter-bar"><div class="filter-row"><input type="text" id="toolSearch" placeholder="搜索工具名称或描述..." oninput="filterToolTable()"><select id="toolSort" onchange="filterToolTable()"><option value="updated_desc">最近更新</option><option value="created_desc">最新创建</option><option value="created_asc">最早创建</option><option value="name_asc">名称 A-Z</option><option value="name_desc">名称 Z-A</option></select><span class="filter-count" id="toolCount"></span></div><div id="filterTagGroups"></div><div class="selected-tags" id="selectedFilterTags" style="display:none;"><span class="selected-tags__label">已选标签：</span><span id="selectedTagsList"></span><span class="clear-all" onclick="clearAllFilterTags()">清除全部</span></div></div><div id="toolTagsTable" class="loading">加载中...</div><div id="toolPagination"></div>`; await loadToolTagsTable(); }

async function loadToolTagsTable() { try { await loadLabelsDef(); const repos = await getAllToolRepos(); allToolReposData = repos; renderFilterTagButtons(); filterToolTable(); } catch(e) { document.getElementById('toolTagsTable').innerHTML = `<div class="empty">加载失败：${escapeHtml(e.message)}</div>`; } }

function renderToolTagsTable(repos) { const container = document.getElementById('toolTagsTable'); const countEl = document.getElementById('toolCount'); const totalCount = allToolReposData ? allToolReposData.length : repos.length; if (countEl) countEl.innerHTML = `共 <strong>${totalCount}</strong> 个工具（筛选后 <strong>${repos.length}</strong> 个）`; if (repos.length === 0) { container.innerHTML = '<div class="empty">暂无工具</div>'; document.getElementById('toolPagination').innerHTML = ''; return; } const totalPages = Math.ceil(repos.length / PAGE_SIZE); if (currentPage > totalPages) currentPage = totalPages; const start = (currentPage - 1) * PAGE_SIZE; const pageRepos = repos.slice(start, start + PAGE_SIZE); let html = '<table class="table"><colgroup><col style="width:200px;"><col style="width:28%;"><col style="width:38%;"><col style="width:70px;"></colgroup><thead><tr><th>工具名称</th><th>描述</th><th>当前标签</th><th>操作</th></tr></thead><tbody>'; pageRepos.forEach(repo => { const cnInfo = getToolCnName(repo); const cnClass = cnInfo.real ? 'tool-name-cn real' : 'tool-name-cn'; const createdDate = repo.created_at ? new Date(repo.created_at).toLocaleDateString('zh-CN') : '-'; const tags = (repo.topics || []).map(t => { const label = findLabelById(t); const cls = label ? (label.type === 'dept' ? 'tag--dept' : label.type === 'func' ? 'tag--func' : label.type === 'tech' ? 'tag--tech' : label.type === 'tutorial' ? 'tag--tutorial' : label.type === 'size' ? 'tag--size' : 'tag--custom') : 'tag--offline'; const name = label ? label.name : t; return `<span class="tag ${cls}">${escapeHtml(name)}</span>`; }).join(''); html += `<tr><td><div class="tool-name"><a href="https://github.com/${ORG}/${escapeHtml(repo.name)}" target="_blank" title="在 GitHub 中打开">${escapeHtml(repo.name)}</a></div><div class="${cnClass}">${escapeHtml(cnInfo.name)}</div><div class="tool-created" title="${formatDate(repo.created_at)}">${createdDate}</div></td><td><div class="tool-desc">${escapeHtml(repo.description || '暂无描述')}</div></td><td><div class="tags-cell">${tags || '<span style="color:var(--text-3); font-size:11px;">无标签</span>'}</div></td><td class="action-cell"><button class="btn btn--sm btn--primary" onclick="openEditTagsModal('${escapeHtml(repo.name)}')">编辑</button></td></tr>`; }); html += '</tbody></table>'; container.innerHTML = html; renderPagination(totalPages); }

function renderPagination(totalPages) { const container = document.getElementById('toolPagination'); if (totalPages <= 1) { container.innerHTML = ''; return; } let html = '<div class="pagination">'; html += `<button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>上一页</button>`; for (let i = 1; i <= totalPages; i++) { html += `<button class="${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`; } html += `<button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>下一页</button>`; html += '</div>'; container.innerHTML = html; }

function goToPage(page) { currentPage = page; filterToolTable(); }

function findLabelById(id) { if (!labelsData) return null; for (const l of (labelsData.departments || [])) { if (l.id === id) return { ...l, type: 'dept' }; } for (const l of (labelsData.categories || [])) { if (l.id === id) return { ...l, type: 'func' }; } for (const l of (labelsData.tech_stacks || [])) { if (l.id === id) return { ...l, type: 'tech' }; } for (const l of (labelsData.tutorial_status || [])) { if (l.id === id) return { ...l, type: 'tutorial' }; } for (const l of (labelsData.file_sizes || [])) { if (l.id === id) return { ...l, type: 'size' }; } for (const ct of (labelsData.custom_types || [])) { for (const l of (ct.labels || [])) { if (l.id === id) return { ...l, type: 'custom', typeName: ct.name }; } } return null; }

function filterToolTable() { const keyword = (document.getElementById('toolSearch')?.value || '').toLowerCase(); const sort = document.getElementById('toolSort')?.value || 'updated_desc'; let filtered = allToolReposData; if (keyword) { filtered = filtered.filter(r => r.name.toLowerCase().includes(keyword) || (r.description || '').toLowerCase().includes(keyword) || (r.topics || []).some(t => t.toLowerCase().includes(keyword))); } const deptTags = selectedFilterTags.dept; const funcTags = selectedFilterTags.func; const techTags = selectedFilterTags.tech; const tutorialTags = selectedFilterTags.tutorial; const sizeTags = selectedFilterTags.size; const customTags = selectedFilterTags.custom; if (deptTags.length > 0) { filtered = filtered.filter(r => (r.topics || []).some(t => deptTags.includes(t))); } if (funcTags.length > 0) { filtered = filtered.filter(r => (r.topics || []).some(t => funcTags.includes(t))); } if (techTags.length > 0) { filtered = filtered.filter(r => (r.topics || []).some(t => techTags.includes(t))); } if (tutorialTags.length > 0) { filtered = filtered.filter(r => (r.topics || []).some(t => tutorialTags.includes(t))); } if (sizeTags.length > 0) { filtered = filtered.filter(r => (r.topics || []).some(t => sizeTags.includes(t))); } if (customTags.length > 0) { filtered = filtered.filter(r => (r.topics || []).some(t => customTags.includes(t))); } filtered = [...filtered]; switch (sort) { case 'updated_desc': filtered.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at)); break; case 'created_desc': filtered.sort((a, b) => new Date(b.created_at) - new Date(a.created_at)); break; case 'created_asc': filtered.sort((a, b) => new Date(a.created_at) - new Date(b.created_at)); break; case 'name_asc': filtered.sort((a, b) => a.name.localeCompare(b.name)); break; case 'name_desc': filtered.sort((a, b) => b.name.localeCompare(a.name)); break; } renderToolTagsTable(filtered); }

function renderFilterTagButtons() { const container = document.getElementById('filterTagGroups'); if (!container || !labelsData) return; let html = ''; const deptName = getTypeDisplayName('dept'); html += `<div class="tag-group"><span class="tag-group__label">${escapeHtml(deptName)}</span><div class="tag-buttons">`; (labelsData.departments || []).forEach(l => { const active = selectedFilterTags.dept.includes(l.id) ? 'active' : ''; html += `<button class="tag-btn ${active}" onclick="toggleFilterTag('dept','${escapeHtml(l.id)}')">${escapeHtml(l.name)}</button>`; }); html += '</div></div>'; const funcName = getTypeDisplayName('func'); html += `<div class="tag-group"><span class="tag-group__label">${escapeHtml(funcName)}</span><div class="tag-buttons">`; (labelsData.categories || []).forEach(l => { const active = selectedFilterTags.func.includes(l.id) ? 'active' : ''; html += `<button class="tag-btn ${active}" onclick="toggleFilterTag('func','${escapeHtml(l.id)}')">${escapeHtml(l.name)}</button>`; }); html += '</div></div>'; const techName = getTypeDisplayName('tech'); html += `<div class="tag-group"><span class="tag-group__label">${escapeHtml(techName)}</span><div class="tag-buttons">`; (labelsData.tech_stacks || []).forEach(l => { const active = selectedFilterTags.tech.includes(l.id) ? 'active' : ''; html += `<button class="tag-btn ${active}" onclick="toggleFilterTag('tech','${escapeHtml(l.id)}')">${escapeHtml(l.name)}</button>`; }); html += '</div></div>'; const tutorialName = getTypeDisplayName('tutorial'); html += `<div class="tag-group"><span class="tag-group__label">${escapeHtml(tutorialName)}</span><div class="tag-buttons">`; (labelsData.tutorial_status || []).forEach(l => { const active = selectedFilterTags.tutorial.includes(l.id) ? 'active' : ''; html += `<button class="tag-btn ${active}" onclick="toggleFilterTag('tutorial','${escapeHtml(l.id)}')">${escapeHtml(l.name)}</button>`; }); html += '</div></div>'; const sizeName = getTypeDisplayName('size'); html += `<div class="tag-group"><span class="tag-group__label">${escapeHtml(sizeName)}</span><div class="tag-buttons">`; (labelsData.file_sizes || []).forEach(l => { const active = selectedFilterTags.size.includes(l.id) ? 'active' : ''; html += `<button class="tag-btn ${active}" onclick="toggleFilterTag('size','${escapeHtml(l.id)}')">${escapeHtml(l.name)}</button>`; }); html += '</div></div>'; const customTypes = labelsData.custom_types || []; customTypes.forEach(ct => { if (ct.labels && ct.labels.length > 0) { html += `<div class="tag-group"><span class="tag-group__label">${escapeHtml(ct.name)}</span><div class="tag-buttons">`; ct.labels.forEach(l => { const active = selectedFilterTags.custom.includes(l.id) ? 'active' : ''; html += `<button class="tag-btn ${active}" onclick="toggleFilterTag('custom','${escapeHtml(l.id)}')">${escapeHtml(l.name)}</button>`; }); html += '</div></div>'; } }); container.innerHTML = html; renderSelectedTags(); }

function toggleFilterTag(type, tagId) { const arr = selectedFilterTags[type]; const idx = arr.indexOf(tagId); if (idx >= 0) arr.splice(idx, 1); else arr.push(tagId); renderFilterTagButtons(); currentPage = 1; filterToolTable(); }

function clearAllFilterTags() { selectedFilterTags = { dept: [], func: [], tech: [], tutorial: [], size: [], custom: [] }; renderFilterTagButtons(); currentPage = 1; filterToolTable(); }

function removeFilterTag(tagId) { for (const type of ['dept', 'func', 'tech', 'tutorial', 'size', 'custom']) { const idx = selectedFilterTags[type].indexOf(tagId); if (idx >= 0) { selectedFilterTags[type].splice(idx, 1); break; } } renderFilterTagButtons(); currentPage = 1; filterToolTable(); }

function renderSelectedTags() { const container = document.getElementById('selectedFilterTags'); const list = document.getElementById('selectedTagsList'); if (!container || !list) return; const allSelected = [...selectedFilterTags.dept, ...selectedFilterTags.func, ...selectedFilterTags.tech, ...selectedFilterTags.tutorial, ...selectedFilterTags.size, ...selectedFilterTags.custom]; if (allSelected.length === 0) { container.style.display = 'none'; return; } container.style.display = 'flex'; let html = ''; allSelected.forEach(tagId => { const label = findLabelById(tagId); const name = label ? label.name : tagId; html += `<span class="selected-tag">${escapeHtml(name)} <span class="remove" onclick="removeFilterTag('${escapeHtml(tagId)}')">×</span></span>`; }); list.innerHTML = html; }

function openEditTagsModal(repoName) { currentEditTool = repoName; const repo = allToolReposData.find(r => r.name === repoName); currentEditTopics = repo ? [...(repo.topics || [])] : []; document.getElementById('editTagsTitle').textContent = `编辑标签：${repoName}`; const allLabels = []; (labelsData?.departments || []).forEach(l => allLabels.push({ ...l, type: 'dept' })); (labelsData?.categories || []).forEach(l => allLabels.push({ ...l, type: 'func' })); (labelsData?.tech_stacks || []).forEach(l => allLabels.push({ ...l, type: 'tech' })); (labelsData?.tutorial_status || []).forEach(l => allLabels.push({ ...l, type: 'tutorial' })); (labelsData?.file_sizes || []).forEach(l => allLabels.push({ ...l, type: 'size' })); (labelsData?.custom_types || []).forEach(ct => { (ct.labels || []).forEach(l => allLabels.push({ ...l, type: 'custom', typeName: ct.name })); }); currentEditTopics.forEach(t => { if (!allLabels.some(l => l.id === t)) { allLabels.push({ id: t, name: t + ' (未定义)', type: 'unknown' }); } }); let html = '<div class="form-group"><label>勾选/取消标签</label><div class="checkbox-group">'; allLabels.forEach(l => { const checked = currentEditTopics.includes(l.id); const cls = l.type === 'dept' ? 'tag--dept' : l.type === 'func' ? 'tag--func' : l.type === 'tech' ? 'tag--tech' : l.type === 'tutorial' ? 'tag--tutorial' : l.type === 'size' ? 'tag--size' : l.type === 'custom' ? 'tag--custom' : 'tag--offline'; html += `<label class="checkbox-item ${checked ? 'checked' : ''}"><input type="checkbox" value="${escapeHtml(l.id)}" ${checked ? 'checked' : ''} onchange="this.parentElement.classList.toggle('checked', this.checked)"><span class="tag ${cls}">${escapeHtml(l.name)}</span></label>`; }); html += '</div></div>'; document.getElementById('editTagsBody').innerHTML = html; document.getElementById('editTagsModal').classList.add('show'); }

function closeEditTagsModal() { document.getElementById('editTagsModal').classList.remove('show'); currentEditTool = null; }

async function saveEditTags() { const checkboxes = document.querySelectorAll('#editTagsBody input[type="checkbox"]'); const newTopics = []; checkboxes.forEach(cb => { if (cb.checked) newTopics.push(cb.value); }); try { await ghPut(`/repos/${ORG}/${currentEditTool}/topics`, { names: newTopics }); const repo = allToolReposData.find(r => r.name === currentEditTool); if (repo) repo.topics = newTopics; allReposCache = null; filterToolTable(); closeEditTagsModal(); showToast('标签已保存，正在触发展示页面重建...', 'info'); try { await ghPost(`/repos/${ORG}/${TOOLHUB_REPO}/actions/workflows/deploy.yml/dispatches`, { ref: 'main' }); showToast('标签已保存，展示页面将在 1-2 分钟后自动更新', 'success'); } catch(e) { showToast(`标签已保存，但触发构建失败：${e.message}（请手动在 Actions 页面触发构建）`, 'error'); } } catch(e) { showToast('保存失败：' + e.message, 'error'); } }

async function renderIssues() { document.getElementById('content').innerHTML = `<div class="content__title"><img src="static/icons/name_tag.png" alt="记录"> 上传记录</div><div class="content__desc">查看所有上传记录，支持搜索、状态筛选、标记已下线、关闭/重开 Issue。</div><div class="search-box"><input type="text" id="issueSearch" placeholder="搜索工具名称..." oninput="filterIssues()"><select id="issueStateFilter" onchange="filterIssues()"><option value="all">全部状态</option><option value="open">进行中</option><option value="closed">已关闭</option></select></div><div id="issuesList" class="loading">加载中...</div>`; await loadIssues(); }

async function loadIssues() { try { const issues = await ghGet(`/repos/${ORG}/${UPLOAD_REPO}/issues?state=all&per_page=100&sort=created&direction=desc`); allIssues = issues.filter(i => !i.pull_request); renderIssuesList(allIssues); } catch(e) { document.getElementById('issuesList').innerHTML = `<div class="empty">加载失败：${escapeHtml(e.message)}</div>`; } }

function renderIssuesList(issues) { const list = document.getElementById('issuesList'); if (issues.length === 0) { list.innerHTML = '<div class="empty">没有上传记录</div>'; return; } let html = '<table class="table"><colgroup><col style="width:60px;"><col style="width:220px;"><col style="width:100px;"><col style="width:90px;"><col style="width:160px;"><col style="width:140px;"><col style="width:auto;"></colgroup><thead><tr><th>#</th><th>工具名称</th><th>上传者</th><th>状态</th><th>标签</th><th>创建时间</th><th>操作</th></tr></thead><tbody>'; issues.forEach(issue => { const stateTag = issue.state === 'open' ? '<span class="tag tag--func">进行中</span>' : '<span class="tag tag--offline">已关闭</span>'; const labels = (issue.labels || []).map(l => `<span class="tag ${l.name === '已下线' ? 'tag--offline' : 'tag--dept'}">${escapeHtml(l.name)}</span>`).join(''); const toolName = issue.title ? issue.title.replace('[上传工具]:', '').trim() : '-'; const hasOffline = (issue.labels || []).some(l => l.name === '已下线'); html += `<tr><td>#${issue.number}</td><td><strong>${escapeHtml(toolName)}</strong></td><td>${escapeHtml(issue.user.login)}</td><td class="state-cell">${stateTag}</td><td>${labels || '-'}</td><td>${formatDate(issue.created_at)}</td><td><a class="btn btn--sm" href="${issue.html_url}" target="_blank">查看</a> ${!hasOffline ? `<button class="btn btn--sm" onclick="markOffline(${issue.number})">已下线</button>` : ''} ${issue.state === 'open' ? `<button class="btn btn--sm" onclick="closeIssue(${issue.number})">关闭</button>` : `<button class="btn btn--sm" onclick="reopenIssue(${issue.number})">重开</button>`}</td></tr>`; }); html += '</tbody></table>'; list.innerHTML = html; }

async function markOffline(num) { showConfirm('标记已下线', `确定要给 Issue #${num} 添加"已下线"标签吗？`, async () => { try { await ghPost(`/repos/${ORG}/${UPLOAD_REPO}/issues/${num}/labels`, { labels: ['已下线'] }); showToast(`Issue #${num} 已标记为"已下线"`, 'success'); await loadIssues(); } catch(e) { showToast('标记失败：' + e.message, 'error'); } }, { confirmBtnText: '标记' }); }

function filterIssues() { const keyword = (document.getElementById('issueSearch')?.value || '').toLowerCase(); const state = document.getElementById('issueStateFilter')?.value || 'all'; let filtered = allIssues; if (keyword) filtered = filtered.filter(i => (i.title || '').toLowerCase().includes(keyword)); if (state !== 'all') filtered = filtered.filter(i => i.state === state); renderIssuesList(filtered); }

async function closeIssue(num) { showConfirm('关闭 Issue', `确定要关闭 Issue #${num} 吗？`, async () => { try { await ghPatch(`/repos/${ORG}/${UPLOAD_REPO}/issues/${num}`, { state: 'closed' }); showToast(`Issue #${num} 已关闭`, 'success'); await loadIssues(); } catch(e) { showToast('关闭失败：' + e.message, 'error'); } }); }

async function reopenIssue(num) { try { await ghPatch(`/repos/${ORG}/${UPLOAD_REPO}/issues/${num}`, { state: 'open' }); showToast(`Issue #${num} 已重新打开`, 'success'); await loadIssues(); } catch(e) { showToast('重开失败：' + e.message, 'error'); } }

initToken();
</script>
</body>
</html>
