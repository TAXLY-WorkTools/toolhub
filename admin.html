<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="static/icons/command_block.png">
<title>管理后台 · TAXLY WorkTools</title>
<style>
  :root {
    --card: #FFFFFF;
    --bg: #F7F8FA;
    --border-lt: #EEF1F5;
    --border: #E4E9EF;
    --text-3: #A8B4C0;
    --text-2: #7A8899;
    --text: #3A4758;
    --accent-lt: #7A8899;
    --accent: #5A6878;
    --accent-hover: #4E5C6C;
    --accent-dark: #3A4758;
    --success-lt: #B4C0B8;
    --success: #5E7868;
    --success-bg: #F0F4F1;
    --info-lt: #B4BEC8;
    --info: #5E7488;
    --info-bg: #F0F2F5;
    --warning-lt: #D0C8B0;
    --warning: #8A7860;
    --warning-bg: #F4F1EC;
    --danger-lt: #D0B8B8;
    --danger: #8A6262;
    --danger-bg: #F4F0F0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background-color: var(--bg);
    background-image:
      linear-gradient(135deg, rgba(90, 104, 120, 0.03) 25%, transparent 25%),
      linear-gradient(225deg, rgba(90, 104, 120, 0.03) 25%, transparent 25%),
      linear-gradient(45deg, rgba(90, 104, 120, 0.02) 25%, transparent 25%),
      linear-gradient(315deg, rgba(90, 104, 120, 0.02) 25%, transparent 25%);
    background-size: 20px 20px;
    background-position: 0 0, 10px 0, 10px -10px, 0px 10px;
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
  }
  .topbar {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px) saturate(180%);
    -webkit-backdrop-filter: blur(12px) saturate(180%);
    border-bottom: 2px solid var(--accent-dark);
    padding: 0 24px;
    height: 56px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
    max-width: 1680px;
    margin: 0 auto;
  }
  .topbar__title { font-size: 18px; font-weight: 700; color: var(--accent-dark); display: flex; align-items: center; gap: 8px; }
  .topbar__back {
    color: var(--accent);
    text-decoration: none;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 6px;
    transition: all 0.15s;
  }
  .topbar__back:hover { background: rgba(90, 104, 120, 0.1); color: var(--accent-dark); }
  .main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px;
  }
  .card {
    background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .card__title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 16px;
    color: var(--accent-dark);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card__title img { width: 20px; height: 20px; object-fit: contain; }
  .mc-icon {
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border-lt);
  }
  th {
    background: rgba(90, 104, 120, 0.08);
    font-weight: 600;
    color: var(--accent-dark);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  tr:hover { background: rgba(90, 104, 120, 0.03); }
  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
    margin-right: 4px;
    margin-bottom: 2px;
  }
  .tag--success { background: var(--success-bg); color: var(--success); }
  .tag--info { background: var(--info-bg); color: var(--info); }
  .tag--warning { background: var(--warning-bg); color: var(--warning); }
  .tag--danger { background: var(--danger-bg); color: var(--danger); }
  .tag--accent { background: rgba(90, 104, 120, 0.1); color: var(--accent); }
  .btn {
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--card);
    cursor: pointer;
    font-size: 12px;
    text-decoration: none;
    color: var(--text);
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .btn:hover { background: rgba(90, 104, 120, 0.08); border-color: var(--accent-lt); }
  .btn--primary {
    background: var(--success);
    color: #fff;
    border-color: var(--success);
  }
  .btn--primary:hover { background: #4E6858; }
  .btn--danger {
    background: var(--danger-bg);
    color: var(--danger);
    border-color: var(--danger-lt);
  }
  .btn--danger:hover { background: var(--danger); color: #fff; }
  .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .info-box {
    padding: 12px 16px;
    background: var(--info-bg);
    border: 1px solid var(--info-lt);
    border-radius: 6px;
    font-size: 13px;
    color: var(--info);
    margin-bottom: 16px;
    line-height: 1.7;
  }
  .info-box strong { color: var(--accent-dark); }
  .warning-box {
    padding: 12px 16px;
    background: var(--warning-bg);
    border: 1px solid var(--warning-lt);
    border-radius: 6px;
    font-size: 13px;
    color: var(--warning);
    margin-bottom: 16px;
    line-height: 1.7;
  }
  .warning-box strong { color: var(--accent-dark); }
  .toast {
    position: fixed;
    top: 70px;
    right: 24px;
    padding: 12px 20px;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    z-index: 1000;
    opacity: 0;
    transform: translateY(-10px);
    transition: opacity 0.2s, transform 0.2s;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--danger); }
  .toast.info { background: var(--accent); }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
    text-align: center;
  }
  .stat-card__value {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent-dark);
    margin-bottom: 4px;
  }
  .stat-card__label {
    font-size: 12px;
    color: var(--text-2);
  }
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-3);
    font-style: italic;
  }
</style>
</head>
<body>
<div class="topbar">
  <div style="display:flex;align-items:center;gap:12px;">
    <a class="topbar__back" href="index.html">← 返回主页</a>
    <div class="topbar__title">
      <img class="mc-icon" src="static/icons/command_block.png" alt="logo" style="width:28px;height:28px;">
      <span>TAXLY WorkTools</span> · 管理后台
    </div>
  </div>
</div>

<div class="main">
  <div class="stat-grid">
    <div class="stat-card">
      <div class="stat-card__value" id="totalTools">--</div>
      <div class="stat-card__label">工具总数</div>
    </div>
    <div class="stat-card">
      <div class="stat-card__value" id="totalUploads">--</div>
      <div class="stat-card__label">上传记录</div>
    </div>
    <div class="stat-card">
      <div class="stat-card__value" id="totalLabels">--</div>
      <div class="stat-card__label">标签数量</div>
    </div>
  </div>

  <div class="card">
    <div class="card__title"><img class="mc-icon" src="static/icons/name_tag.png" alt="">工具标签管理</div>
    <div class="info-box">
      <strong>说明：</strong>标签用于工具分类和筛选。修改标签后需要手动触发同步 Workflow 才能生效。
    </div>
    <div id="labelsTableContainer">
      <div class="empty-state">加载中...</div>
    </div>
  </div>

  <div class="card">
    <div class="card__title"><img class="mc-icon" src="static/icons/book.png" alt="">上传记录</div>
    <div id="uploadsTableContainer">
      <div class="empty-state">加载中...</div>
    </div>
  </div>

  <div class="card">
    <div class="card__title">同步操作</div>
    <div class="warning-box">
      <strong>注意：</strong>手动触发同步会重新拉取所有仓库信息并重建主页，约需 1-2 分钟。
    </div>
    <div class="btn-group">
      <button class="btn btn--primary" onclick="triggerSync()">🔄 手动触发同步 Workflow</button>
      <a class="btn" href="https://github.com/TAXLY-WorkTools/toolhub/actions" target="_blank">查看 Workflow 运行记录 →</a>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const GITHUB_API = 'https://api.github.com';
const ORG = 'TAXLY-WorkTools';
const REPO = 'toolhub';

function showToast(msg, type = 'info') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast ' + type + ' show';
  setTimeout(() => { toast.className = 'toast ' + type; }, 2500);
}

async function fetchLabels() {
  try {
    const res = await fetch(`${GITHUB_API}/repos/${ORG}/${REPO}/contents/labels.json`);
    if (!res.ok) throw new Error('Failed to fetch labels');
    const data = await res.json();
    const content = atob(data.content);
    const labels = JSON.parse(content);
    renderLabelsTable(labels);
    document.getElementById('totalLabels').textContent = Object.keys(labels).length;
  } catch (e) {
    document.getElementById('labelsTableContainer').innerHTML = '<div class="empty-state">标签加载失败</div>';
    console.error(e);
  }
}

function renderLabelsTable(labels) {
  const container = document.getElementById('labelsTableContainer');
  const keys = Object.keys(labels);
  if (keys.length === 0) {
    container.innerHTML = '<div class="empty-state">暂无标签</div>';
    return;
  }
  let html = '<table><thead><tr><th>标签名称</th><th>显示名称</th><th>颜色</th><th>操作</th></tr></thead><tbody>';
  keys.forEach(key => {
    const label = labels[key];
    html += `<tr>
      <td><code>${key}</code></td>
      <td>${label.name || '-'}</td>
      <td><span class="tag tag--accent">${label.color || 'default'}</span></td>
      <td><button class="btn" onclick="editLabel('${key}')">编辑</button></td>
    </tr>`;
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

function editLabel(key) {
  showToast('标签编辑功能开发中', 'info');
}

async function fetchUploads() {
  try {
    const res = await fetch(`${GITHUB_API}/repos/${ORG}/${REPO}/issues?state=all&per_page=30&sort=created&direction=desc`);
    if (!res.ok) throw new Error('Failed to fetch issues');
    const issues = await res.json();
    const uploads = issues.filter(issue => issue.title && issue.title.includes('上传') || (issue.body && issue.body.includes('zip')));
    renderUploadsTable(uploads);
    document.getElementById('totalUploads').textContent = uploads.length;
  } catch (e) {
    document.getElementById('uploadsTableContainer').innerHTML = '<div class="empty-state">上传记录加载失败</div>';
    console.error(e);
  }
}

function renderUploadsTable(uploads) {
  const container = document.getElementById('uploadsTableContainer');
  if (uploads.length === 0) {
    container.innerHTML = '<div class="empty-state">暂无上传记录</div>';
    return;
  }
  let html = '<table><thead><tr><th>序号</th><th>工具名称</th><th>状态</th><th>上传时间</th><th>操作</th></tr></thead><tbody>';
  uploads.forEach((upload, idx) => {
    const date = new Date(upload.created_at).toLocaleString('zh-CN');
    const status = upload.state === 'open' ? '处理中' : '已完成';
    const statusClass = upload.state === 'open' ? 'tag--warning' : 'tag--success';
    html += `<tr>
      <td>${idx + 1}</td>
      <td>${upload.title || '-'}</td>
      <td><span class="tag ${statusClass}">${status}</span></td>
      <td>${date}</td>
      <td><a class="btn" href="${upload.html_url}" target="_blank">查看</a></td>
    </tr>`;
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

async function fetchTools() {
  try {
    const res = await fetch(`${GITHUB_API}/orgs/${ORG}/repos?per_page=100&sort=updated`);
    if (!res.ok) throw new Error('Failed to fetch repos');
    const repos = await res.json();
    const toolRepos = repos.filter(r => r.name !== REPO && !r.archived);
    document.getElementById('totalTools').textContent = toolRepos.length;
  } catch (e) {
    console.error(e);
  }
}

function triggerSync() {
  if (!confirm('确认手动触发同步 Workflow？这会重新构建主页，约需 1-2 分钟。')) return;
  showToast('正在跳转到 GitHub Actions 页面...', 'info');
  setTimeout(() => {
    window.open(`https://github.com/${ORG}/${REPO}/actions/workflows/build.yml`, '_blank');
  }, 500);
}

fetchLabels();
fetchUploads();
fetchTools();
</script>
</body>
</html>
