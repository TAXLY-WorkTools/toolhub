<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Portfolio{% endblock %}</title>
  {% block stylesheets %}<link rel="stylesheet" href="static/style.css">{% endblock %}
  {% block feed_link %}<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="feed.xml">{% endblock %}
  <style>
    .site-header__nav {
      background: rgba(44, 54, 63, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 8px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .site-header__nav .back-link {
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s;
    }
    .site-header__nav .back-link:hover {
      color: #fff;
    }
    .top-nav {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 2px solid #3A4758;
    }
    .top-nav__inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .top-nav__brand {
      color: #3A4758;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .top-nav__brand:hover { opacity: 0.9; }
    .top-nav__links {
      display: flex;
      gap: 4px;
    }
    .top-nav__link {
      color: #5A6878;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .top-nav__link:hover {
      background: rgba(90, 104, 120, 0.1);
      color: #3A4758;
    }
    .top-nav__link--active {
      background: rgba(90, 104, 120, 0.15);
      color: #3A4758;
    }
    .mc-icon {
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }
    .mc-icon--sm {
      width: 24px;
      height: 24px;
    }
    .mc-icon--logo {
      width: 32px;
      height: 32px;
    }
    @media (max-width: 768px) {
      .top-nav__inner { padding: 0 12px; }
      .top-nav__link { padding: 6px 10px; font-size: 13px; }
      .top-nav__link span { display: none; }
    }
  </style>
</head>
<body>
  {% if site.navigation.back_link_url %}
  <nav class="site-header__nav">
    <a href="{{ site.navigation.back_link_url }}" class="back-link">&#8592; {{ site.navigation.back_link_label }}</a>
  </nav>
  {% endif %}
