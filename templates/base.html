<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="static/icons/logo.png">
  <title>{% block title %}Portfolio{% endblock %}</title>
  {% block stylesheets %}<link rel="stylesheet" href="static/style.css">{% endblock %}
  {% block feed_link %}<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="feed.xml">{% endblock %}
  <style>
    :root {
      --bg-icon-url: url("static/icons/logo.png");
    }
    .site-header__nav {
      background: rgba(44, 54, 63, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 8px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .site-header__nav .back-link {
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s;
    }
    .site-header__nav .back-link:hover {
      color: #fff;
    }
    .top-nav {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 2px solid rgba(58, 71, 88, 0.6);
      box-shadow: 0 2px 8px rgba(90, 104, 120, 0.1);
    }
    .top-nav__inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .top-nav__brand {
      color: #3A4758;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .top-nav__brand:hover { opacity: 0.9; }
    .top-nav__brand-text {
      font-family: monospace;
      font-size: 14px;
      font-weight: 700;
      color: #3A4758;
      letter-spacing: 0.5px;
    }
    .top-nav__brand-sub {
      font-size: 12px;
      color: #7A8899;
      margin-left: 6px;
      font-weight: 400;
    }
    .top-nav__links {
      display: flex;
      gap: 4px;
    }
    .top-nav__link {
      color: #5A6878;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .top-nav__link:hover {
      background: rgba(90, 104, 120, 0.1);
      color: #3A4758;
    }
    .top-nav__link--active {
      background: rgba(90, 104, 120, 0.15);
      color: #3A4758;
    }
    .mc-icon {
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }
    .mc-icon--sm {
      width: 28px;
      height: 28px;
    }
    .mc-icon--logo {
      width: 36px;
      height: 36px;
    }
    @media (max-width: 768px) {
      .top-nav__inner { padding: 0 12px; }
      .top-nav__link { padding: 6px 10px; font-size: 13px; }
      .top-nav__link span { display: none; }
      .top-nav__brand-sub { display: none; }
    }

    /* 背景logo斜向图案（20°倾斜，6%透明度） */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background-image: var(--bg-icon-url);
      background-size: 64px 64px;
      background-repeat: repeat;
      transform: rotate(20deg);
      opacity: 0.06;
      pointer-events: none;
      z-index: 0;
    }
    main {
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  {% if site.navigation.back_link_url %}
  <nav class="site-header__nav">
    <a href="{{ site.navigation.back_link_url }}" class="back-link">&#8592; {{ site.navigation.back_link_label }}</a>
  </nav>
  {% endif %}

  <nav class="top-nav">
    <div class="top-nav__inner">
      <a class="top-nav__brand" href="{% block home_href %}index.html{% endblock %}">
        <img class="mc-icon mc-icon--logo" src="{% block icon_prefix %}static/icons/{% endblock %}logo.png" alt="logo">
        <span class="top-nav__brand-text">TAXLY WorkTools</span>
        <span class="top-nav__brand-sub">工具仓库</span>
      </a>
      <div class="top-nav__links">
        <a class="top-nav__link top-nav__link--active" href="index.html">
          <img class="mc-icon mc-icon--sm" src="{% block icon_prefix_2 %}static/icons/{% endblock %}logo.png" alt="">
          <span>首页</span>
        </a>
        <a class="top-nav__link" href="pack.html" target="_blank" rel="noopener">
          <img class="mc-icon mc-icon--sm" src="{% block icon_prefix_3 %}static/icons/{% endblock %}furnace.png" alt="">
          <span>打包工具</span>
        </a>
        <a class="top-nav__link" href="upload.html" target="_blank" rel="noopener">
          <img class="mc-icon mc-icon--sm" src="{% block icon_prefix_4 %}static/icons/{% endblock %}firework_rocket.png" alt="">
          <span>上传工具</span>
        </a>
        <!-- 管理后台入口已隐藏，管理员直接输网址访问 admin.html
        <a class="top-nav__link" href="admin.html" target="_blank" rel="noopener">
          <img class="mc-icon mc-icon--sm" src="{% block icon_prefix_5 %}static/icons/{% endblock %}command_block.png" alt="">
          <span>管理后台</span>
        </a>
        -->
        <a class="top-nav__link" href="about.html">
          <img class="mc-icon mc-icon--sm" src="{% block icon_prefix_6 %}static/icons/{% endblock %}recipe_book.png" alt="">
          <span>关于</span>
        </a>
      </div>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    {{ site.footer | safe }}
    · <a href="https://github.com/TAXLY-WorkTools" target="_blank" rel="noopener">关于本平台 →</a>
  </footer>
</body>
</html>
