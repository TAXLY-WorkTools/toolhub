<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>上传工具 - TAXLY WorkTools</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f6f8fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }
        .container {
            max-width: 720px;
            width: 100%;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            padding: 40px 48px;
        }
        h1 {
            font-size: 26px;
            font-weight: 600;
            color: #1f2328;
            margin-bottom: 6px;
        }
        .subtitle {
            color: #57606a;
            font-size: 15px;
            margin-bottom: 28px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 500;
            font-size: 14px;
            color: #1f2328;
            margin-bottom: 5px;
        }
        label .required {
            color: #d1242f;
            margin-left: 2px;
        }
        input,
        select {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            background: #ffffff;
            transition: 0.2s;
            font-family: inherit;
        }
        input:focus,
        select:focus {
            outline: none;
            border-color: #0969da;
            box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.2);
        }
        .file-zone {
            border: 2px dashed #d0d7de;
            border-radius: 8px;
            padding: 32px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            background: #f9fafb;
            position: relative;
        }
        .file-zone:hover {
            border-color: #0969da;
            background: #f0f6ff;
        }
        .file-zone.dragover {
            border-color: #0969da;
            background: #e8f0fe;
        }
        .file-zone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }
        .file-zone .icon {
            font-size: 36px;
            display: block;
            margin-bottom: 8px;
        }
        .file-zone .text {
            font-size: 14px;
            color: #24292f;
        }
        .file-zone .hint {
            font-size: 12px;
            color: #57606a;
            margin-top: 4px;
        }
        .file-list {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .file-tag {
            background: #e8ecf0;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            color: #1f2328;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .file-tag .remove {
            cursor: pointer;
            color: #8b949e;
            font-weight: 700;
        }
        .file-tag .remove:hover {
            color: #d1242f;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #2da44e;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }
        .submit-btn:hover {
            background: #22863a;
        }
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .message {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }
        .message.success {
            display: block;
            background: #dafbe1;
            color: #116329;
            border: 1px solid #a7e6b8;
        }
        .message.error {
            display: block;
            background: #ffe3e6;
            color: #a0111f;
            border: 1px solid #f5c2c7;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #0969da;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📤 上传新工具</h1>
        <p class="subtitle">提交后系统将自动创建仓库、上传代码并更新工具库网站</p>

        <form id="uploadForm">
            <div class="form-group">
                <label>工具名称 <span class="required">*</span></label>
                <input type="text" id="toolName" placeholder="例如：letter_generator" required />
                <div style="font-size:12px;color:#57606a;margin-top:4px;">建议使用英文小写 + 下划线，如 letter_generator</div>
            </div>

            <div class="form-group">
                <label>工具描述 <span class="required">*</span></label>
                <input type="text" id="toolDesc" placeholder="例如：自动生成银行函证工具" required />
            </div>

            <div class="form-group">
                <label>所属部门 <span class="required">*</span></label>
                <select id="department" required>
                    <option value="">请选择</option>
                    <option value="审计部">审计部</option>
                    <option value="税务部">税务部</option>
                    <option value="咨询部">咨询部</option>
                </select>
            </div>

            <div class="form-group">
                <label>功能分类 <span class="required">*</span></label>
                <select id="category" required>
                    <option value="">请选择</option>
                    <option value="数据分析">数据分析</option>
                    <option value="函证生成">函证生成</option>
                    <option value="底稿检查">底稿检查</option>
                    <option value="报告生成">报告生成</option>
                </select>
            </div>

            <div class="form-group">
                <label>上传代码 <span class="required">*</span></label>
                <div class="file-zone" id="fileZone">
                    <span class="icon">📁</span>
                    <div class="text">点击选择文件或拖拽文件夹到此</div>
                    <div class="hint">支持单个文件、多个文件或整个文件夹</div>
                    <input type="file" id="fileInput" webkitdirectory multiple />
                </div>
                <div class="file-list" id="fileList"></div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">🚀 提交上传</button>
        </form>

        <div class="message" id="message"></div>
        <a href="https://taxly-worktools.github.io/toolhub/" class="back-link">← 返回工具库</a>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const fileZone = document.getElementById('fileZone');
        const form = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageEl = document.getElementById('message');

        let selectedFiles = [];

        fileInput.addEventListener('change', function(e) {
            selectedFiles = Array.from(e.target.files);
            renderFileList();
        });

        fileZone.addEventListener('dragover', function(e) {
            e.preventDefault();
            fileZone.classList.add('dragover');
        });
        fileZone.addEventListener('dragleave', function(e) {
            e.preventDefault();
            fileZone.classList.remove('dragover');
        });
        fileZone.addEventListener('drop', function(e) {
            e.preventDefault();
            fileZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                selectedFiles = Array.from(e.dataTransfer.files);
                fileInput.files = e.dataTransfer.files;
                renderFileList();
            }
        });

        function renderFileList() {
            fileList.innerHTML = '';
            if (selectedFiles.length === 0) {
                fileList.innerHTML = '<span style="color:#8b949e;font-size:13px;">尚未选择文件</span>';
                return;
            }
            selectedFiles.forEach((file, index) => {
                const tag = document.createElement('span');
                tag.className = 'file-tag';
                tag.innerHTML =
                    `${file.name} (${(file.size / 1024).toFixed(1)} KB) <span class="remove" data-index="${index}">×</span>`;
                tag.querySelector('.remove').addEventListener('click', function() {
                    selectedFiles.splice(index, 1);
                    renderFileList();
                });
                fileList.appendChild(tag);
            });
        }
        renderFileList();

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const toolName = document.getElementById('toolName').value.trim();
            const toolDesc = document.getElementById('toolDesc').value.trim();
            const department = document.getElementById('department').value;
            const category = document.getElementById('category').value;

            if (!toolName || !toolDesc || !department || !category || selectedFiles.length === 0) {
                showMessage('请完整填写所有字段并至少选择一个文件', 'error');
                return;
            }

            if (/[\u4e00-\u9fa5]/.test(toolName)) {
                showMessage('工具名称请不要使用中文，请用英文小写 + 下划线', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ 提交中...';
            showMessage('', '');

            const formData = new FormData();
            formData.append('tool_name', toolName);
            formData.append('description', toolDesc);
            formData.append('department', department);
            formData.append('category', category);
            selectedFiles.forEach(file => {
                const relativePath = file.webkitRelativePath || file.name;
                formData.append('files', file, relativePath);
            });

            try {
                const response = await fetch('https://proud-mud-1f6e.aba1330895415.workers.dev/upload', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer taxly2026'
                    },
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    showMessage(`✅ ${result.message || '上传成功！正在处理中，稍后可在工具库网站查看。'}`, 'success');
                    form.reset();
                    selectedFiles = [];
                    renderFileList();
                } else {
                    showMessage(`❌ 上传失败：${result.error || '未知错误'}`, 'error');
                }
            } catch (err) {
                showMessage(`❌ 网络错误：${err.message}`, 'error');
            }

            submitBtn.disabled = false;
            submitBtn.textContent = '🚀 提交上传';
        });

        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = 'message';
            if (text) {
                messageEl.classList.add(type === 'success' ? 'success' : 'error');
            }
        }
    </script>
</body>
</html>
