<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上传工具 - TAXLY WorkTools</title>
</head>
<body>
    <h1>📤 上传新工具</h1>
    <p>填写信息后点击提交，跳转到 GitHub 评论区上传压缩包</p>

    <form id="uploadForm">
        <label>工具名称：<input type="text" id="toolName" placeholder="letter_generator" required></label><br>
        <label>工具描述：<input type="text" id="toolDesc" placeholder="自动生成银行函证工具" required></label><br>
        <label>所属部门：
            <select id="department" required>
                <option value="">请选择</option>
                <option value="审计部">审计部</option>
                <option value="税务部">税务部</option>
                <option value="咨询部">咨询部</option>
            </select>
        </label><br>
        <label>功能分类：
            <select id="category" required>
                <option value="">请选择</option>
                <option value="数据分析">数据分析</option>
                <option value="函证生成">函证生成</option>
                <option value="底稿检查">底稿检查</option>
                <option value="报告生成">报告生成</option>
            </select>
        </label><br>
        <button type="submit">🚀 跳转 GitHub</button>
    </form>

    <p id="message"></p>
    <a href="https://taxly-worktools.github.io/toolhub/">← 返回工具库</a>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const toolName = document.getElementById('toolName').value.trim();
            const toolDesc = document.getElementById('toolDesc').value.trim();
            const department = document.getElementById('department').value;
            const category = document.getElementById('category').value;

            if (!toolName || !toolDesc || !department || !category) {
                document.getElementById('message').textContent = '❌ 请完整填写所有字段';
                return;
            }
            if (/[\u4e00-\u9fa5]/.test(toolName)) {
                document.getElementById('message').textContent = '❌ 工具名称请用英文小写 + 下划线';
                return;
            }

            const url = 'https://github.com/TAXLY-WorkTools/upload-portal/issues/new?template=upload.yml&tool_name=' + encodeURIComponent(toolName) + '&description=' + encodeURIComponent(toolDesc) + '&department=' + encodeURIComponent(department) + '&category=' + encodeURIComponent(category);
            window.open(url, '_blank');
            document.getElementById('message').textContent = '✅ 已跳转 GitHub，请在评论区拖拽上传 .zip 压缩包';
        });
    </script>
</body>
</html>
