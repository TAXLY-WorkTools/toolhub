<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上传工具 - TAXLY WorkTools</title>
<style>
  /* ===== MC主题商务风 - 配色变量 ===== */
  :root {
    --card: #FFFFFF;
    --bg: #F7F8FA;
    --border-lt: #EEF1F5;
    --border: #E4E9EF;
    --text-3: #A8B4C0;
    --text-2: #7A8899;
    --text: #3A4758;
    --accent-lt: #7A8899;
    --accent: #5A6878;
    --accent-hover: #4E5C6C;
    --accent-dark: #3A4758;
    --success-lt: #B4C0B8;
    --success: #5E7868;
    --success-bg: #F0F4F1;
    --info-lt: #B4BEC8;
    --info: #5E7488;
    --info-bg: #F0F2F5;
    --warning-lt: #D0C8B0;
    --warning: #8A7860;
    --warning-bg: #F4F1EC;
    --danger-lt: #D0B8B8;
    --danger: #8A6262;
    --danger-bg: #F4F0F0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background-color: var(--bg);
    background-image: 
      linear-gradient(135deg, rgba(90, 104, 120, 0.03) 25%, transparent 25%),
      linear-gradient(225deg, rgba(90, 104, 120, 0.03) 25%, transparent 25%),
      linear-gradient(45deg, rgba(90, 104, 120, 0.02) 25%, transparent 25%),
      linear-gradient(315deg, rgba(90, 104, 120, 0.02) 25%, transparent 25%);
    background-size: 20px 20px;
    background-position: 0 0, 10px 0, 10px -10px, 0px 10px;
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }
  .topbar {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px) saturate(180%);
    -webkit-backdrop-filter: blur(12px) saturate(180%);
    border-bottom: 2px solid var(--accent-dark);
    padding: 0 24px;
    height: 56px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
    max-width: 1680px;
    margin: 0 auto;
  }
  .topbar__title { font-size: 18px; font-weight: 700; color: var(--accent-dark); display: flex; align-items: center; gap: 8px; }
  .topbar__back {
    color: var(--accent);
    text-decoration: none;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 6px;
    transition: all 0.15s;
  }
  .topbar__back:hover { background: rgba(90, 104, 120, 0.1); color: var(--accent-dark); }
  .container {
    max-width: 720px;
    margin: 40px auto;
    padding: 0 24px;
  }
  .card {
    background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
    margin-bottom: 16px;
    transition: all 0.2s;
  }
  .card:hover {
    border-color: var(--accent-lt);
    box-shadow: 0 4px 16px rgba(90, 104, 120, 0.1);
  }
  .card__title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--accent-dark);
  }
  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }
  .field__label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 4px;
    color: var(--text);
  }
  .field__label .required { color: var(--danger); margin-left: 2px; }
  .field__label .hint {
    font-weight: 400;
    font-style: italic;
    color: var(--text-3);
    font-size: 12px;
  }
  input[type="text"], select {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    transition: all 0.15s;
    background: var(--card);
    color: var(--text);
  }
  input[type="text"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(90, 104, 120, 0.1);
  }
  input.error, select.error {
    border-color: var(--danger);
    background: var(--danger-bg);
  }
  .file-upload-area {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    background: rgba(255, 255, 255, 0.3);
  }
  .file-upload-area:hover, .file-upload-area.dragover {
    border-color: var(--accent);
    background: rgba(90, 104, 120, 0.05);
  }
  .file-upload-area__text { font-size: 14px; color: var(--text); }
  .file-upload-area__hint { font-size: 12px; color: var(--text-3); margin-top: 4px; }
  .file-info {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--info-bg);
    border: 1px solid var(--info-lt);
    border-radius: 6px;
    margin-bottom: 12px;
  }
  .file-info__details { flex: 1; }
  .file-info__name { font-weight: 600; font-size: 13px; color: var(--text); }
  .file-info__meta { font-size: 12px; color: var(--text-2); }
  .file-info__badge {
    background: var(--success);
    color: #fff;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
  }
  .file-info__remove {
    color: var(--danger);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 4px 8px;
    border-radius: 4px;
  }
  .file-info__remove:hover { background: var(--danger-bg); }
  .auto-load-notice {
    padding: 10px 14px;
    background: var(--warning-bg);
    border: 1px solid var(--warning-lt);
    border-radius: 6px;
    font-size: 12px;
    color: var(--warning);
    margin-bottom: 12px;
    display: none;
  }
  .auto-load-notice.show { display: block; }
  .btn-submit {
    width: 100%;
    padding: 14px;
    background: var(--success);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-submit:hover { background: #4E6858; }
  .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
  .message {
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 13px;
    display: none;
  }
  .message.show { display: block; }
  .message.error { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-lt); }
  .message.success { background: var(--success-bg); color: var(--success); border: 1px solid var(--success-lt); }
  .message.info { background: var(--info-bg); color: var(--info); border: 1px solid var(--info-lt); }
  .steps-guide {
    background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
    margin-top: 16px;
  }
  .steps-guide__title { font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--text-2); }
  .steps-guide ol { margin-left: 20px; font-size: 12px; color: var(--text-2); line-height: 1.8; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar__title">
    <img src="static/icons/firework_rocket.png" alt="logo" style="width:28px;height:28px;">
    <span>TAXLY WorkTools</span> · 上传新工具
  </div>
  <a class="topbar__back" href="index.html">← 返回工具库</a>
</div>

<div class="container">
  <div class="card">
    <div class="card__title">填写工具信息</div>
    <div class="auto-load-notice" id="autoLoadNotice">
      正在从打包页面自动加载压缩包...
    </div>
    <form id="uploadForm">
      <div class="field">
        <label class="field__label">工具名称 <span class="required">*</span> <span class="hint">（英文小写+下划线，GitHub 仓库名）</span></label>
        <input type="text" id="toolName" placeholder="letter_generator" required>
      </div>
      <div class="field">
        <label class="field__label">工具描述 <span class="required">*</span></label>
        <input type="text" id="toolDesc" placeholder="自动生成银行函证工具" required>
      </div>
      <div class="field">
        <label class="field__label">作者 <span class="hint">（选填，不填显示为"作者：未知"）</span></label>
        <input type="text" id="author" placeholder="张三">
      </div>
      <div class="field">
        <label class="field__label">所属部门 <span class="required">*</span></label>
        <select id="department" required>
          <option value="">请选择</option>
          <option value="税审">税审</option>
          <option value="工程">工程</option>
          <option value="招标">招标</option>
          <option value="综合">综合</option>
          <option value="通用">通用</option>
        </select>
      </div>
      <div class="field">
        <label class="field__label">功能分类 <span class="required">*</span></label>
        <select id="category" required>
          <option value="">请选择</option>
          <option value="检查校对">检查校对</option>
          <option value="数据分析">数据分析</option>
          <option value="文件管理">文件管理</option>
          <option value="文本生成">文本生成</option>
          <option value="效率工具">效率工具</option>
        </select>
      </div>
      <div class="field">
        <label class="field__label">压缩包 <span class="required">*</span> <span class="hint">（.zip 格式，从打包页面生成）</span></label>
        <div id="fileInfo" style="display:none;">
          <div class="file-info">
            <div class="file-info__details">
              <div class="file-info__name" id="fileName"></div>
              <div class="file-info__meta" id="fileMeta"></div>
            </div>
            <span class="file-info__badge" id="fileBadge">已加载</span>
            <span class="file-info__remove" onclick="removeFile()" title="移除">×</span>
          </div>
        </div>
        <div class="file-upload-area" id="fileUploadArea" onclick="document.getElementById('fileInput').click()">
          <div class="file-upload-area__text">点击选择或拖拽 .zip 压缩包到此处</div>
          <div class="file-upload-area__hint">支持 .zip 格式，建议从打包页面生成</div>
        </div>
        <input type="file" id="fileInput" accept=".zip" style="display:none">
      </div>
      <button type="submit" class="btn-submit" id="submitBtn">跳转 GitHub 上传</button>
    </form>
    <div class="message" id="message"></div>
  </div>
  <div class="steps-guide">
    <div class="steps-guide__title">上传流程</div>
    <ol>
      <li>在打包页面填写工具信息并生成 .zip 压缩包</li>
      <li>在此页面填写工具信息（从打包页面跳转会自动预填）</li>
      <li>压缩包会自动加载（从打包页面跳转时），或手动选择</li>
      <li>点击"跳转 GitHub 上传"，在 GitHub 评论区拖拽上传压缩包</li>
      <li>后端自动处理（约1-2分钟），工具出现在工具库</li>
    </ol>
  </div>
</div>

<script>
let loadedFile = null;
let isAutoLoaded = false;

function showMessage(text, type = 'info') {
  const msg = document.getElementById('message');
  msg.textContent = text;
  msg.className = 'message show ' + type;
  setTimeout(() => { msg.className = 'message'; }, 5000);
}

function formatSize(bytes) {
  if (bytes > 1048576) return (bytes / 1048576).toFixed(1) + ' MB';
  if (bytes > 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return bytes + ' B';
}

function setFile(file, autoLoaded = false) {
  loadedFile = file;
  isAutoLoaded = autoLoaded;
  document.getElementById('fileInfo').style.display = 'block';
  document.getElementById('fileUploadArea').style.display = 'none';
  document.getElementById('fileName').textContent = file.name;
  document.getElementById('fileMeta').textContent = formatSize(file.size) + (autoLoaded ? ' · 自动从打包页面加载' : ' · 手动选择');
  document.getElementById('fileBadge').textContent = autoLoaded ? '自动加载' : '已选择';
  document.getElementById('autoLoadNotice').classList.remove('show');
}

function removeFile() {
  loadedFile = null;
  isAutoLoaded = false;
  document.getElementById('fileInfo').style.display = 'none';
  document.getElementById('fileUploadArea').style.display = 'block';
  document.getElementById('fileInput').value = '';
}

function loadZipFromIndexedDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('IndexedDB not supported')); return; }
    const request = indexedDB.open('ToolHubPack', 1);
    request.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('zips')) db.createObjectStore('zips');
    };
    request.onsuccess = (e) => {
      const db = e.target.result;
      try {
        const tx = db.transaction('zips', 'readonly');
        const store = tx.objectStore('zips');
        const getReq = store.get('latest_zip');
        getReq.onsuccess = () => {
          db.close();
          if (getReq.result && getReq.result.blob) resolve(getReq.result);
          else reject(new Error('No zip found'));
        };
        getReq.onerror = () => { db.close(); reject(getReq.error); };
      } catch (err) { db.close(); reject(err); }
    };
    request.onerror = () => reject(request.error);
  });
}

document.addEventListener('DOMContentLoaded', async function() {
  const params = new URLSearchParams(window.location.search);
  const fromPack = params.get('from_pack') === '1';
  const toolName = params.get('tool_name');
  let description = params.get('description') || '';
  let author = params.get('author') || '';
  const displayName = params.get('display_name');

  const authorMatch = description.match(/【作者：([^】]+)】/);
  if (authorMatch && !author) {
    author = authorMatch[1];
    description = description.replace(/【作者：[^】]+】/, '').trim();
  }

  if (toolName) document.getElementById('toolName').value = toolName;
  if (description) document.getElementById('toolDesc').value = description;
  if (author) document.getElementById('author').value = author;

  if (fromPack) {
    document.getElementById('autoLoadNotice').classList.add('show');
    try {
      const result = await loadZipFromIndexedDB();
      if (result && result.blob) {
        const file = new File([result.blob], (result.toolName || 'tool') + '.zip', { type: 'application/zip' });
        setFile(file, true);
        showMessage('已自动从打包页面加载压缩包，请确认信息后提交', 'success');
      } else { throw new Error('No zip data'); }
    } catch (e) {
      console.warn('IndexedDB 自动加载失败:', e);
      document.getElementById('autoLoadNotice').classList.remove('show');
      showMessage('自动加载压缩包失败，请手动选择 .zip 文件', 'info');
    }
  }
});

document.getElementById('fileInput').addEventListener('change', function(e) {
  if (e.target.files.length > 0) {
    const file = e.target.files[0];
    if (!file.name.toLowerCase().endsWith('.zip')) { showMessage('请选择 .zip 格式的压缩包', 'error'); return; }
    setFile(file, false);
  }
});

const dropZone = document.getElementById('fileUploadArea');
dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('dragover'); });
dropZone.addEventListener('drop', function(e) {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  if (e.dataTransfer.files.length > 0) {
    const file = e.dataTransfer.files[0];
    if (!file.name.toLowerCase().endsWith('.zip')) { showMessage('请选择 .zip 格式的压缩包', 'error'); return; }
    setFile(file, false);
  }
});

document.getElementById('uploadForm').addEventListener('submit', function(e) {
  e.preventDefault();
  document.querySelectorAll('.error').forEach(el => el.classList.remove('error'));

  const toolName = document.getElementById('toolName').value.trim();
  let toolDesc = document.getElementById('toolDesc').value.trim();
  const author = document.getElementById('author').value.trim();
  const department = document.getElementById('department').value;
  const category = document.getElementById('category').value;

  if (author) {
    toolDesc += '【作者：' + author + '】';
  }

  let firstError = null;
  if (!toolName) { const el = document.getElementById('toolName'); el.classList.add('error'); firstError = firstError || el; }
  else if (/[\u4e00-\u9fa5]/.test(toolName)) {
    const el = document.getElementById('toolName'); el.classList.add('error'); firstError = firstError || el;
    showMessage('工具名称请用英文小写 + 下划线', 'error'); return;
  }
  if (!toolDesc) { const el = document.getElementById('toolDesc'); el.classList.add('error'); firstError = firstError || el; }
  if (!department) { const el = document.getElementById('department'); el.classList.add('error'); firstError = firstError || el; }
  if (!category) { const el = document.getElementById('category'); el.classList.add('error'); firstError = firstError || el; }
  if (!loadedFile) { showMessage('请选择或加载 .zip 压缩包', 'error'); return; }

  if (firstError) {
    firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
    firstError.focus();
    showMessage('请完整填写所有必填字段', 'error');
    return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '正在跳转...';

  const url = 'https://github.com/TAXLY-WorkTools/upload-portal/issues/new?template=upload.yml' +
    '&tool_name=' + encodeURIComponent(toolName) +
    '&description=' + encodeURIComponent(toolDesc) +
    '&author=' + encodeURIComponent(author) +
    '&department=' + encodeURIComponent(department) +
    '&category=' + encodeURIComponent(category);

  showMessage('已跳转 GitHub，请在评论区拖拽上传压缩包：' + loadedFile.name, 'success');
  window.open(url, '_blank');

  setTimeout(() => {
    btn.disabled = false;
    btn.textContent = '跳转 GitHub 上传';
  }, 2000);
});
</script>
</body>
</html>
